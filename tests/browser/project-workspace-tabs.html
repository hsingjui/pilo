<!doctype html>
<!-- Run with pnpm exec vite, then open /tests/browser/project-workspace-tabs.html. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Project workspace tabs regression</title>
	</head>
	<body>
		<pre id="results">Running…</pre>
		<div id="root"></div>
		<script type="module">
			import "../../src/index.css";
			import { createElement as h, useEffect, useState } from "react";
			import { createRoot } from "react-dom/client";
			import {
				ProjectWorkspaceContext,
				useProjectWorkspaces,
			} from "../../src/components/app/project-workspace-context.tsx";
			import { ProjectWorkspacePanel } from "../../src/components/app/project-workspace-panel.tsx";
			import { SessionHeader } from "../../src/components/chat/chat-session-header.tsx";
			import { ChatMarkdownLinkScope } from "../../src/components/chat/chat-markdown-link.tsx";
			import { Streamdown, defaultUrlTransform } from "streamdown";
			import {
				MARKDOWN_COMPONENTS,
				MARKDOWN_REHYPE_PLUGINS,
			} from "../../src/components/chat/chat-markdown-components.tsx";
			import { PreferencesProvider } from "../../src/lib/preferences-provider.tsx";
			import { TooltipProvider } from "../../src/ui/tooltip.tsx";
			import { initializeI18n } from "../../src/i18n/index.ts";
			await initializeI18n("en-US");
			const projects = ["alpha", "beta"].map((id) => ({
				id,
				name: id,
				path: `/tmp/${id}`,
				connection: { id: "local", name: "Local", kind: { type: "local" } },
				metadata: {
					cwd: `/tmp/${id}`,
					gitBranch: null,
					piVersion: "",
					refreshedAtMs: 0,
				},
				createdAtMs: 0,
				lastOpenedAtMs: 0,
			}));
			const projectIds = projects.map((project) => project.id);
			const fixture = {};
			window.workspaceFixture = fixture;
			let mounts = 0;
			const calls = [];
			const pixel = Array.from(
				atob(
					"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+aU1cAAAAASUVORK5CYII=",
				),
				(char) => char.charCodeAt(0),
			);
			const readRemoteImage = async (projectId, path) => {
				calls.push({
					command: "remote_read_image",
					args: { id: projectId, path },
				});
				return new Uint8Array(pixel);
			};
			const previousTauri = globalThis.isTauri;
			const previousInternals = window.__TAURI_INTERNALS__;
			const previousEditor = localStorage.getItem("pilo.projectEditor.v1");
			globalThis.isTauri = true;
			window.__TAURI_INTERNALS__ = {
				invoke: async (command, args) => {
					calls.push({ command, args });
					if (command === "project_fs_read_image") return pixel;
					if (command !== "project_file_link_open") return null;
					if (!args.preview) return null;
					const path = decodeURIComponent(new URL(args.url).pathname);
					return {
						path,
						content: path.endsWith(".md")
							? "# Rendered Markdown\n\n**Safe report**\n\n<script>window.previewExecuted=true<\/script>"
							: "const value = '<script>literal code<\/script>';\n".repeat(100),
					};
				},
			};
			const root = createRoot(document.getElementById("root"));
			function ChatStub() {
				const [output, setOutput] = useState("Agent output");
				useEffect(() => {
					mounts++;
					return () => {
						mounts--;
					};
				}, []);
				useEffect(() => {
					fixture.appendOutput = setOutput;
				}, []);
				return h(
					"div",
					{ className: "flex min-h-0 flex-1 flex-col" },
					h(
						"div",
						{ id: "chat-scroll", className: "min-h-0 flex-1 overflow-auto" },
						h(
							Streamdown,
							{
								mode: "static",
								components: MARKDOWN_COMPONENTS,
								rehypePlugins: MARKDOWN_REHYPE_PLUGINS,
								urlTransform: defaultUrlTransform,
							},
							"[notes](file:///tmp/notes.md) [source](file:///tmp/main.ts) [document](file:///tmp/document.pdf) [range](src/range.ts:60-62)",
						),
						h("p", { id: "agent-output" }, output),
						h("div", { style: { height: 2000 } }, "Conversation stays mounted"),
					),
					h("textarea", {
						id: "draft",
						className: "h-20 shrink-0",
						defaultValue: "Unsent draft",
						"aria-label": "Draft",
					}),
				);
			}
			function Harness() {
				const [availableProjects, setAvailableProjects] = useState(projectIds);
				const workspace = useProjectWorkspaces(availableProjects);
				const [projectIndex, setProjectIndex] = useState(0);
				const [title, setTitle] = useState("Conversation A");
				const [width, setWidth] = useState(940);
				const [headerOverlay, setHeaderOverlay] = useState(false);
				const [chatKind, setChatKind] = useState("session");
				const [web, setWeb] = useState(false);
				const project = projects[projectIndex];
				useEffect(() => {
					Object.assign(fixture, {
						workspace,
						setProjectIndex,
						setAvailableProjects,
						setTitle,
						setWidth,
						setHeaderOverlay,
						setChatKind,
						setWeb,
					});
				}, [workspace]);
				return h(
					ProjectWorkspaceContext.Provider,
					{ value: workspace },
					h(
						"main",
						{
							id: "workspace",
							className:
								"@container relative flex min-w-0 flex-col border border-border",
							style: { width, maxWidth: "100%", height: 560 },
						},
						h(SessionHeader, {
							project,
							overlay: headerOverlay,
							session:
								chatKind === "session"
									? { id: title, title, projectRecord: project }
									: undefined,
							temporary: chatKind === "temporary",
							onExpandSidebar() {},
						}),
						h(
							ProjectWorkspacePanel,
							{
								project,
								headerOverlay,
								readImage: web ? readRemoteImage : undefined,
							},
							h(
								ChatMarkdownLinkScope.Provider,
								{ value: project },
								h(ChatStub),
							),
						),
					),
				);
			}
			function assert(value, message) {
				if (!value) throw new Error(message);
			}
			async function settle(frames = 4) {
				for (let i = 0; i < frames; i++)
					await new Promise(requestAnimationFrame);
			}
			async function waitFor(predicate, message) {
				for (let i = 0; i < 180; i++) {
					if (predicate()) return;
					await settle(1);
				}
				throw new Error(message);
			}
			const selected = () =>
				document.querySelector('[role="tab"][aria-selected="true"]');
			const tabs = () => [...document.querySelectorAll('[role="tab"]')];
			const fileCalls = () =>
				calls.filter((call) => call.command === "project_file_link_open");
			async function assertTabHint(tab, label) {
				assert(
					!tab.hasAttribute("title"),
					"Tabs must not use native title tooltips",
				);
				tab.dispatchEvent(
					new PointerEvent("pointermove", {
						pointerType: "mouse",
						bubbles: true,
					}),
				);
				await waitFor(
					() =>
						[...document.querySelectorAll('[role="tooltip"]')].some(
							(tooltip) => tooltip.textContent === label,
						),
					"Shared Hint tooltip did not show the complete title/path",
				);
				document.dispatchEvent(
					new KeyboardEvent("keydown", { key: "Escape", bubbles: true }),
				);
				tab.dispatchEvent(
					new PointerEvent("pointerout", {
						pointerType: "mouse",
						bubbles: true,
						relatedTarget: document.body,
					}),
				);
				await settle();
			}
			function assertPreviewFrame() {
				const panel = document.querySelector('[role="tabpanel"]:not([inert])');
				const style = getComputedStyle(panel);
				const rect = panel.getBoundingClientRect();
				const container = panel.parentElement.getBoundingClientRect();
				assert(
					["Top", "Right", "Bottom", "Left"].every((side) => {
						// Fractional DPR rounds a CSS border down to whole device pixels.
						const width = parseFloat(style[`border${side}Width`]);
						return width > 0 && width <= 1 && 1 - width < 1 / devicePixelRatio;
					}) && parseFloat(style.borderTopLeftRadius) > 0,
					"Markdown/code preview must have a rounded 1px frame",
				);
				assert(
					rect.left > container.left &&
						rect.right < container.right &&
						rect.top > container.top &&
						rect.bottom < container.bottom,
					"Preview frame must be inset from the workspace edges",
				);
			}
			function middleClick(target) {
				const down = new MouseEvent("mousedown", {
					button: 1,
					bubbles: true,
					cancelable: true,
				});
				target.dispatchEvent(down);
				assert(
					down.defaultPrevented,
					"Middle press must prevent native autoscroll/paste",
				);
				const click = new MouseEvent("auxclick", {
					button: 1,
					bubbles: true,
					cancelable: true,
				});
				target.dispatchEvent(click);
				assert(
					click.defaultPrevented,
					"Middle click must prevent native defaults",
				);
			}
			try {
				root.render(
					h(PreferencesProvider, null, h(TooltipProvider, null, h(Harness))),
				);
				await waitFor(
					() => !!fixture.workspace && document.querySelector("#draft"),
					"Harness did not mount",
				);
				for (const native of [true, false]) {
					globalThis.isTauri = native;
					for (const width of [940, 320]) {
						fixture.setWidth(width);
						for (const dark of [false, true]) {
							document.documentElement.classList.toggle("dark", dark);
							fixture.setChatKind("landing");
							await settle();
							assert(
								tabs().length === 0 &&
									!document.querySelector('[role="tablist"]'),
								"Landing must not show a default New chat tab or background",
							);
							fixture.setChatKind("temporary");
							await settle();
							assert(
								selected()?.textContent === "Temporary session" &&
									getComputedStyle(selected()).borderTopStyle === "dashed",
								"Empty temporary chats must retain their dashed identifier",
							);
							fixture.setChatKind("session");
							await settle();
							assert(
								selected()?.textContent === "Conversation A" &&
									getComputedStyle(selected()).backgroundColor ===
										"rgba(0, 0, 0, 0)",
								"A standalone conversation title must have no selected background",
							);
						}
					}
				}
				globalThis.isTauri = true;
				document.documentElement.classList.remove("dark");
				fixture.setWidth(940);
				fixture.setChatKind("landing");
				fixture.workspace.openFile("alpha", {
					path: "/tmp/landing.md",
					content: "# Landing preview",
				});
				await settle();
				assert(
					tabs().length === 2 && tabs()[0].textContent === "New session",
					"A landing preview needs a New chat tab to return to the composer",
				);
				tabs()[0].click();
				await settle();
				assert(
					selected() === tabs()[0] &&
						getComputedStyle(selected()).backgroundColor !== "rgba(0, 0, 0, 0)",
					"Chat selection must stay visible when file tabs are open",
				);
				fixture.workspace.closeFile("alpha", "/tmp/landing.md");
				await settle();
				assert(
					tabs().length === 0,
					"Closing the last preview must restore the empty landing header",
				);
				fixture.setChatKind("session");
				await settle();
				const longTitle =
					"A long conversation title that should leave room for file tabs ".repeat(
						4,
					);
				fixture.setTitle(longTitle);
				await settle();
				const singleTitleWidth = tabs()[0].getBoundingClientRect().width;
				const scroll = document.querySelector("#chat-scroll");
				const draft = document.querySelector("#draft");
				scroll.scrollTop = 650;
				const initialChatScroll = scroll.scrollTop;
				const height = scroll.clientHeight;
				const links = [...scroll.querySelectorAll("button")];
				assert(
					fileCalls().length === 0,
					"Rendering must not read or open files",
				);
				links[0].click();
				await waitFor(
					() => document.querySelector('[role="tabpanel"] h1'),
					"Markdown did not render in a tab",
				);
				assert(
					tabs().length === 2 && selected().textContent === "notes.md",
					"File tab must follow the conversation tab",
				);
				assert(
					tabs()[0].getBoundingClientRect().width < singleTitleWidth &&
						tabs()[0].getBoundingClientRect().width <=
							14 *
								parseFloat(
									getComputedStyle(document.documentElement).fontSize,
								) +
								1,
					"Opening a file must compact the conversation title",
				);
				await assertTabHint(tabs()[0], longTitle);
				await assertTabHint(selected(), "/tmp/notes.md");
				assert(
					getComputedStyle(selected()).backgroundColor === "rgba(0, 0, 0, 0)",
					"The file tab wrapper, not its title button, must own the background",
				);
				assertPreviewFrame();
				assert(
					selected().querySelector(".lucide-file-text"),
					"Markdown needs a document icon",
				);
				document
					.querySelector('fieldset[aria-label="Open file in editor"] button')
					.click();
				await settle();
				assert(
					calls.at(-1).command === "plugin:opener|open_url" &&
						calls.at(-1).args.url.endsWith("/tmp/notes.md"),
					"The header editor button must open the selected Markdown file",
				);
				document
					.querySelector('button[aria-label="Choose editor"]')
					.dispatchEvent(
						new KeyboardEvent("keydown", { key: "ArrowDown", bubbles: true }),
					);
				await waitFor(
					() => document.querySelector('[role="menuitemradio"]'),
					"Editor menu did not open",
				);
				[...document.querySelectorAll('[role="menuitemradio"]')]
					.find((item) => item.textContent === "VS Code")
					.click();
				await settle();
				assert(
					calls.at(-1).args.url === "vscode://file/tmp/notes.md",
					"Changing editor must still target the selected file",
				);
				assert(
					fileCalls()[0].args.preview === true,
					"Markdown must request read-only preview",
				);
				assert(
					!window.previewExecuted &&
						!document.querySelector('[role="tabpanel"] script'),
					"Markdown scripts must not run",
				);
				assert(
					scroll.clientHeight === height &&
						scroll.scrollTop === initialChatScroll,
					"File selection changed hidden conversation geometry",
				);
				fixture.appendOutput("Agent continued while previewing");
				await settle();
				tabs()[0].click();
				await settle();
				assert(
					document.querySelector("#draft") === draft &&
						draft.value === "Unsent draft",
					"Draft DOM/value was lost",
				);
				assert(
					document.querySelector("#chat-scroll") === scroll &&
						scroll.scrollTop === initialChatScroll,
					"Conversation scroll was lost",
				);
				assert(
					document
						.querySelector("#agent-output")
						.textContent.includes("continued"),
					"Background updates stopped",
				);
				links[0].click();
				await settle();
				assert(
					tabs().length === 2 && fileCalls().length === 1,
					"Reopening a file must focus the existing tab without rereading",
				);
				tabs()[0].click();
				await settle();
				links[1].click();
				await waitFor(
					() => !!document.querySelector('[role="tabpanel"] .shiki'),
					"Code syntax highlighting did not load",
				);
				assertPreviewFrame();
				const keyword = document.querySelector(
					'.shiki span[style*="token-keyword"]',
				);
				assert(
					keyword &&
						getComputedStyle(keyword).color !==
							getComputedStyle(keyword.closest("code")).color,
					"Code syntax colors are not applied",
				);
				assert(
					tabs().length === 3 && selected().textContent === "main.ts",
					"Code tab missing",
				);
				assert(
					selected().querySelector(".lucide-file-code-2"),
					"Source code needs a code icon",
				);
				document
					.querySelector('fieldset[aria-label="Open file in editor"] button')
					.click();
				await settle();
				assert(
					calls.at(-1).args.url === "vscode://file/tmp/main.ts",
					"The editor target must follow the active code tab",
				);
				assert(
					!document.querySelector('[role="tabpanel"] script'),
					"Code must remain inert text",
				);
				fixture.setTitle("Conversation B");
				await settle();
				assert(
					tabs()[0].textContent === "Conversation B" && tabs().length === 3,
					"Same-project session switch lost file tabs",
				);
				fixture.setProjectIndex(1);
				await settle();
				assert(tabs().length === 1, "File tabs leaked to another project");
				fixture.setProjectIndex(0);
				await settle();
				assert(tabs().length === 3, "Returning to a project lost its tabs");
				selected().dispatchEvent(
					new KeyboardEvent("keydown", { key: "Home", bubbles: true }),
				);
				await settle();
				assert(selected() === tabs()[0], "Home must select chat");
				selected().dispatchEvent(
					new KeyboardEvent("keydown", { key: "End", bubbles: true }),
				);
				await settle();
				assert(
					selected().textContent === "main.ts",
					"End must select the last file",
				);
				selected().dispatchEvent(
					new KeyboardEvent("keydown", { key: "Delete", bubbles: true }),
				);
				await settle();
				assert(
					tabs().length === 2 && selected().textContent === "notes.md",
					"Closing active file must select its neighbor",
				);
				assert(
					document.activeElement === selected(),
					"Closing a tab must restore keyboard focus",
				);
				fixture.setWidth(320);
				document.documentElement.setAttribute("data-remote-webui", "");
				await settle();
				for (const dark of [false, true]) {
					document.documentElement.classList.toggle("dark", dark);
					await settle();
					const list = document.querySelector('[role="tablist"]');
					assertPreviewFrame();
					assert(
						document.querySelector("#workspace").scrollWidth <= 320,
						"Tab strip overflows narrow workspace",
					);
					assert(
						list.scrollWidth >= list.clientWidth,
						"Narrow tabs must scroll horizontally",
					);
					const closeButton = selected().parentElement.querySelector(
						'button[aria-label^="Close"]',
					);
					assert(
						closeButton.getBoundingClientRect().right <=
							list.getBoundingClientRect().right + 1,
						"Selected file close button is clipped",
					);
					if (matchMedia("(pointer:coarse)").matches)
						for (const button of list.querySelectorAll("button"))
							assert(
								button.getBoundingClientRect().height >= 44,
								"Touch target below 44px",
							);
				}
				document.documentElement.classList.remove("dark");
				document.querySelector('button[aria-label="Close notes.md"]').click();
				await settle();
				assert(
					tabs().length === 1 && selected() === tabs()[0],
					"Closing the last file must return to chat",
				);
				document
					.querySelector('fieldset[aria-label="Open project in editor"] button')
					.click();
				await settle();
				assert(
					calls.at(-1).args.url === "vscode://file/tmp/alpha",
					"Returning to chat must restore project-directory opening",
				);
				for (const [name, icon] of [
					["settings.JSON", "file-json-2"],
					["config.yaml", "file-cog"],
					[".env.local", "file-cog"],
					["build.ps1", "square-terminal"],
					["Dockerfile", "square-terminal"],
					["theme.scss", "palette"],
					["output.log", "file-text"],
					["unknown", "file"],
				]) {
					const path = `/tmp/${name}`;
					fixture.workspace.openFile("alpha", { path, content: "" });
					await settle();
					assert(
						selected().querySelector(`.lucide-${icon}`),
						`Wrong icon for ${name}`,
					);
					fixture.workspace.closeFile("alpha", path);
					await settle();
				}
				fixture.setWidth(940);
				fixture.setTitle(longTitle);
				const longPaths = Array.from(
					{ length: 4 },
					(_, index) => `/tmp/a-very-long-preview-file-name-${index}.md`,
				);
				for (const path of longPaths)
					fixture.workspace.openFile("alpha", { path, content: "# Preview" });
				await settle();
				const list = document.querySelector('[role="tablist"]');
				assert(
					list.scrollWidth <= list.clientWidth + 1 &&
						tabs().every((tab) => {
							const label = tab.querySelector("span");
							return (
								label.scrollWidth > label.clientWidth &&
								getComputedStyle(label).textOverflow === "ellipsis"
							);
						}),
					"Multiple long titles must shrink and ellipsize before scrolling",
				);
				fixture.setWidth(320);
				await settle();
				assert(
					list.scrollWidth > list.clientWidth &&
						document.querySelector("#workspace").scrollWidth <= 320,
					"Many tabs must scroll within, not overflow, the narrow workspace",
				);
				selected().dispatchEvent(
					new MouseEvent("auxclick", { button: 2, bubbles: true }),
				);
				tabs()[0].dispatchEvent(
					new MouseEvent("auxclick", { button: 1, bubbles: true }),
				);
				await settle();
				assert(
					tabs().length === 5,
					"Right click and middle click on chat must not close tabs",
				);
				middleClick(tabs()[1].querySelector("span"));
				await settle();
				assert(
					tabs().length === 4 && selected().dataset.filePath === longPaths[3],
					"Middle closing an inactive file must preserve selection",
				);
				middleClick(selected());
				await settle();
				assert(
					tabs().length === 3 &&
						selected().dataset.filePath === longPaths[2] &&
						document.activeElement === selected(),
					"Middle closing the active file must focus its neighbor",
				);
				middleClick(
					selected().parentElement.querySelector(
						'button[aria-label^="Close"] svg',
					),
				);
				await settle();
				assert(
					tabs().length === 2,
					"Middle click on the close icon must close only one file",
				);
				middleClick(selected());
				await settle();
				assert(
					tabs().length === 1 && selected() === tabs()[0],
					"Middle closing the last file must return to chat",
				);
				links[2].click();
				await settle();
				assert(
					fileCalls().at(-1).args.preview === false && tabs().length === 1,
					"PDF must use system opening, not a text tab",
				);
				globalThis.isTauri = false;
				fixture.setTitle("WebUI conversation");
				await settle();
				assert(
					!document.querySelector(
						'fieldset[aria-label="Open project in editor"]',
					),
					"WebUI must not expose native editor launching",
				);
				const before = fileCalls().length;
				links[0].click();
				await settle();
				assert(
					fileCalls().length === before,
					"WebUI must not call native file APIs",
				);
				assert(mounts === 1, "Chat DOM was unmounted during tab navigation");
				fixture.setHeaderOverlay(true);
				await settle();
				const overlayHeight = scroll.clientHeight;
				const overlayScroll = scroll.scrollTop;
				fixture.workspace.openFile("alpha", {
					path: "/tmp/overlay.md",
					content: "# Preview",
				});
				await settle();
				assert(
					scroll.clientHeight === overlayHeight &&
						scroll.scrollTop === overlayScroll,
					"Overlay header changed hidden chat geometry",
				);
				const tabRect = selected().getBoundingClientRect();
				assert(
					selected().contains(
						document.elementFromPoint(
							tabRect.x + tabRect.width / 2,
							tabRect.y + tabRect.height / 2,
						),
					),
					"Preview covers the overlay header",
				);
				fixture.workspace.closeFile("alpha", "/tmp/overlay.md");
				await settle();
				assert(
					scroll.clientHeight === overlayHeight &&
						scroll.scrollTop === overlayScroll,
					"Returning from an overlay preview changed chat geometry",
				);
				fixture.setHeaderOverlay(false);
				await settle();
				for (const native of [true, false]) {
					globalThis.isTauri = native;
					fixture.setWeb(!native);
					await settle();
					for (const width of [940, 320]) {
						fixture.setWidth(width);
						for (const directory of ["", "docs/"]) {
							const path = `/tmp/alpha/${directory}README.md`;
							const imageCallStart = calls.length;
							fixture.workspace.openFile("alpha", {
								path,
								content:
									"# Local images\n\n![Diagram](./diagram.png)\n\n![Escape](../../secret.png)" +
									(directory ? "\n\n![Parent](../overview.png)" : ""),
							});
							await waitFor(() => {
								const images = [
									...document.querySelectorAll(
										'[role="tabpanel"]:not([inert]) img',
									),
								];
								return (
									images.length === (directory ? 2 : 1) &&
									images.every(
										(image) => image.complete && image.naturalWidth === 1,
									)
								);
							}, "Markdown preview did not load local images");
							const imageCalls = calls
								.slice(imageCallStart)
								.filter((call) =>
									["project_fs_read_image", "remote_read_image"].includes(
										call.command,
									),
								);
							assert(
								imageCalls.every(
									(call) =>
										call.command ===
										(native ? "project_fs_read_image" : "remote_read_image"),
								),
								"Preview used the wrong desktop/WebUI image transport",
							);
							assert(
								imageCalls.some(
									(call) =>
										call.args.id === "alpha" &&
										call.args.path === `${directory}diagram.png`,
								),
								"Image must resolve relative to the Markdown directory",
							);
							assert(
								imageCalls.every(
									(call) =>
										!call.args.path.includes("..") &&
										!call.args.path.includes("secret"),
								),
								"Traversal escaped the project image scope",
							);
							if (directory)
								assert(
									imageCalls.some((call) => call.args.path === "overview.png"),
									"Parent image inside the project did not resolve",
								);
							fixture.workspace.closeFile("alpha", path);
							await settle();
						}
					}
				}
				const imageCallStart = calls.length;
				fixture.workspace.openFile("alpha", {
					path: "/tmp/outside.md",
					content: "![Outside](./secret.png)",
				});
				await waitFor(
					() =>
						document
							.querySelector('[role="tabpanel"]:not([inert])')
							?.textContent.includes("Image unavailable"),
					"Outside-project image was not rejected",
				);
				assert(
					!calls
						.slice(imageCallStart)
						.some((call) =>
							["project_fs_read_image", "remote_read_image"].includes(
								call.command,
							),
						),
					"Outside document gained filesystem image access",
				);
				fixture.workspace.closeFile("alpha", "/tmp/outside.md");
				await settle();
				// Source links use the same viewer in both shells; only desktop may read files.
				globalThis.isTauri = true;
				fixture.setWeb(false);
				fixture.setWidth(940);
				await settle();
				const beforeRangeOpen = fileCalls().length;
				links[3].click();
				const activePanel = () =>
					document.querySelector('[role="tabpanel"]:not([inert])');
				const highlighted = () => [
					...(activePanel()?.querySelectorAll("[data-source-line-highlight]") ??
						[]),
				];
				await waitFor(
					() =>
						highlighted().length === 3 &&
						highlighted()[0].dataset.sourceLineStart === "60" &&
						activePanel().querySelector(".shiki") &&
						activePanel().scrollTop > 0,
					"Relative source link did not navigate after async Shiki mounted",
				);
				const rangePath = "/tmp/alpha/src/range.ts";
				assert(
					fileCalls().at(-1).args.url === "file:///tmp/alpha/src/range.ts" &&
						fileCalls().length === beforeRangeOpen + 1,
					"Relative source IPC must use the project root without location syntax",
				);
				const codePanel = activePanel();
				codePanel.scrollTop = 0;
				fixture.workspace.selectFile("alpha", rangePath, {
					start: 60,
					end: 62,
				});
				await waitFor(
					() => codePanel.scrollTop > 0,
					"Repeated range did not scroll again",
				);
				assert(
					fileCalls().length === beforeRangeOpen + 1,
					"Repeated navigation reread cached content",
				);
				fixture.workspace.selectFile("alpha", rangePath, {
					start: 10,
					end: 12,
				});
				await waitFor(
					() =>
						highlighted().length === 3 &&
						highlighted()[0].dataset.sourceLineStart === "10",
					"New range did not replace old emphasis",
				);
				const rangeScroll = codePanel.scrollTop;
				fixture.workspace.selectFile("alpha", rangePath);
				await settle();
				assert(
					highlighted().length === 0 && codePanel.scrollTop === rangeScroll,
					"Range-free selection must clear emphasis without scrolling",
				);
				codePanel.scrollTop = 400;
				fixture.workspace.selectFile("alpha", null);
				await settle();
				fixture.workspace.selectFile("alpha", rangePath);
				await settle();
				assert(
					activePanel() === codePanel && codePanel.scrollTop === 400,
					"Normal tab switching lost the preview DOM or scroll",
				);
				fixture.workspace.closeFile("alpha", rangePath);
				await settle();

				const markdownPath = "/tmp/alpha/source-lines.md";
				const markdownContent =
					Array.from({ length: 80 }, (_, i) => `Paragraph ${i + 1}`).join(
						"\n\n",
					) + "\n\n```ts\nconst marker = 1;\n```";
				for (const native of [true, false]) {
					globalThis.isTauri = native;
					fixture.setWeb(!native);
					for (const width of [940, 320]) {
						fixture.setWidth(width);
						for (const dark of [false, true]) {
							document.documentElement.classList.toggle("dark", dark);
							fixture.workspace.openFile(
								"alpha",
								{ path: markdownPath, content: markdownContent },
								{ start: 101, end: 101 },
							);
							await waitFor(
								() =>
									highlighted().length === 1 &&
									highlighted()[0].textContent === "Paragraph 51" &&
									activePanel().scrollTop > 0,
								"Markdown source lines did not retain global paragraph positions",
							);
							const target = highlighted()[0];
							const bounds = activePanel().getBoundingClientRect();
							assert(
								target.getBoundingClientRect().top >= bounds.top &&
									target.getBoundingClientRect().bottom <= bounds.bottom,
								"Source navigation did not reveal the target inside the file panel",
							);
							assert(
								getComputedStyle(target).backgroundColor !== "rgba(0, 0, 0, 0)",
								"Source emphasis is invisible in the current theme",
							);
							fixture.workspace.selectFile("alpha", markdownPath, {
								start: 162,
								end: 162,
							});
							await waitFor(
								() =>
									highlighted().length === 1 &&
									highlighted()[0].tagName === "DIV" &&
									highlighted()[0].dataset.sourceLineStart === "161" &&
									highlighted()[0].textContent.includes("const marker") &&
									highlighted()[0].querySelector(
										'span[style*="token-keyword"]',
									),
								"Fenced code source wrapper did not survive rich Markdown rendering",
							);
							fixture.workspace.selectFile("alpha", markdownPath, {
								start: 160,
								end: 160,
							});
							await waitFor(
								() => highlighted()[0]?.textContent === "Paragraph 80",
								"Blank Markdown lines must select the nearest rendered block",
							);
							fixture.workspace.closeFile("alpha", markdownPath);
							await settle();
						}
					}
				}
				document.documentElement.classList.remove("dark");
				const beforeWebRange = fileCalls().length;
				links[3].click();
				await settle();
				assert(
					fileCalls().length === beforeWebRange &&
						!fixture.workspace.state
							.get("alpha")
							.files.some((file) => file.path === rangePath),
					"WebUI relative source links must reject before native IPC",
				);
				const plainPath = "/tmp/alpha/large.txt";
				const plainContent = Array.from(
					{ length: 3000 },
					(_, i) => `Line ${i + 1}`,
				).join("\r\n");
				fixture.workspace.openFile(
					"alpha",
					{ path: plainPath, content: plainContent },
					{ start: 2200, end: 2202 },
				);
				await waitFor(
					() => highlighted().length === 1 && activePanel().scrollTop > 0,
					"Plain-text fallback did not navigate to the requested slice",
				);
				assert(
					highlighted()[0].textContent ===
						"Line 2200\r\nLine 2201\r\nLine 2202" &&
						activePanel().querySelector("code").textContent === plainContent,
					"Plain source navigation changed CRLF text or selected the wrong lines",
				);
				fixture.workspace.selectFile("alpha", plainPath, {
					start: 2,
					end: 2500,
				});
				await settle();
				assert(
					highlighted().length === 1 &&
						activePanel().querySelectorAll(".project-source-lines").length ===
							1 &&
						highlighted()[0].textContent.split("\r\n").length === 2499,
					"Large plain ranges must use one wrapper, not one node per line",
				);
				fixture.workspace.selectFile("alpha", plainPath, {
					start: 5000,
					end: 5000,
				});
				await waitFor(
					() => highlighted()[0]?.textContent === "Line 3000",
					"A plain-text location after EOF did not clamp to the final line",
				);
				fixture.workspace.closeFile("alpha", plainPath);
				await settle();
				const pendingOpen = fixture.workspace.openFile;
				pendingOpen("beta", { path: "/tmp/beta.md", content: "Beta" });
				await settle();
				fixture.setAvailableProjects(["alpha"]);
				await settle();
				pendingOpen("beta", { path: "/tmp/late.md", content: "Late read" });
				await settle();
				assert(
					!fixture.workspace.state.has("beta"),
					"A late read resurrected a removed project",
				);
				document.body.dataset.testStatus = "passed";
				document.getElementById("results").textContent =
					"PASS: empty landing header, standalone titles without backgrounds, temporary identifiers, landing preview navigation, shared header tabs, Markdown/code, deduplication, project isolation, preserved draft/scroll/background updates, keyboard navigation, close focus, file-type icons, active-file editor opening, shared Hint tooltips, unified tab surfaces, compact long titles, framed previews, middle-click closing, 320px light/dark layout, system/WebUI routing, root/nested Markdown images, desktop/remote image transports, project image boundaries, source-link IPC, async source highlighting/scroll, repeated and replaced ranges, range clearing, Markdown source maps, large CRLF plain-text ranges and EOF fallback.";
			} catch (error) {
				document.body.dataset.testStatus = "failed";
				document.getElementById("results").textContent = String(
					error.stack ?? error,
				);
				throw error;
			} finally {
				globalThis.isTauri = previousTauri;
				window.__TAURI_INTERNALS__ = previousInternals;
				if (previousEditor === null)
					localStorage.removeItem("pilo.projectEditor.v1");
				else localStorage.setItem("pilo.projectEditor.v1", previousEditor);
				window.dispatchEvent(
					new StorageEvent("storage", { key: "pilo.projectEditor.v1" }),
				);
			}
		</script>
	</body>
</html>
