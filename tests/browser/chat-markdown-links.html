<!doctype html>
<!-- Run with pnpm exec vite, then open /tests/browser/chat-markdown-links.html. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>HTML report links regression</title>
	</head>
	<body>
		<pre id="results">Running…</pre>
		<div id="root" style="width: 320px; max-width: 100%"></div>
		<script type="module">
			import "../../src/index.css";
			import { createElement as h } from "react";
			import { createRoot } from "react-dom/client";
			import { flushSync } from "react-dom";
			import { Streamdown, defaultUrlTransform } from "streamdown";
			import { Toaster, toast } from "sonner";
			import {
				MARKDOWN_COMPONENTS,
				MARKDOWN_REHYPE_PLUGINS,
			} from "../../src/components/chat/chat-markdown-components.tsx";
			import { ChatMarkdownLinkScope } from "../../src/components/chat/chat-markdown-link.tsx";
			import { ProjectWorkspaceContext } from "../../src/components/app/project-workspace-context.tsx";
			import { openHtmlReport } from "../../src/lib/api/reports.ts";
			import { initializeI18n } from "../../src/i18n/index.ts";
			import { findMessageMatches } from "../../src/lib/chat/chat-message-search.ts";
			import {
				applyTextHighlight,
				clearTextHighlight,
			} from "../../src/lib/dom-text-highlight.ts";

			await initializeI18n("en-US");
			const root = createRoot(document.getElementById("root"));
			const calls = [];
			const previews = [];
			const workspace = {
				state: new Map(),
				openFile: (projectId, file) => previews.push({ projectId, file }),
			};

			const url = "file:///Users/example/My%20Pages/报告.html";
			const originalIsTauri = globalThis.isTauri;
			const originalInternals = window.__TAURI_INTERNALS__;
			window.__TAURI_INTERNALS__ = {
				invoke: async (command, args) => {
					calls.push({ command, args });
					if (args.url.includes("missing.html"))
						throw new Error("file link is not accessible: missing remote file");
					return args.preview
						? {
								path: decodeURIComponent(new URL(args.url).pathname),
								content: "# Remote preview",
							}
						: null;
				},
			};
			function assert(condition, message) {
				if (!condition) throw new Error(message);
			}
			function render(kind, markdown = `[查看报告](${url})`, mode = "static") {
				flushSync(() => {
					root.render(
						h(
							ProjectWorkspaceContext.Provider,
							{ value: workspace },
							h(
								ChatMarkdownLinkScope.Provider,
								{
									value: {
										id: kind === "local" ? "project" : `${kind}-project`,
										connection: { kind: { type: kind } },
									},
								},
								h(Toaster),
								h(
									Streamdown,
									{
										mode,
										className: "markdown-renderer",
										components: MARKDOWN_COMPONENTS,
										rehypePlugins: MARKDOWN_REHYPE_PLUGINS,
										urlTransform: defaultUrlTransform,
									},
									markdown,
								),
							),
						),
					);
				});
				return document.querySelector("#root button");
			}

			try {
				globalThis.isTauri = true;
				const local = render("local");
				assert(calls.length === 0, "Rendering must not open files");
				local.focus();
				assert(
					document.activeElement === local,
					"File control must be focusable",
				);
				local.click();
				await new Promise(requestAnimationFrame);
				assert(calls.length === 1, "Local click must invoke exactly once");
				assert(calls[0].command === "project_file_link_open", "Wrong command");
				assert(calls[0].args.projectId === "project", "Project scope lost");
				assert(
					calls[0].args.preview === false,
					"HTML must use the system default",
				);
				assert(calls[0].args.url === new URL(url).href, "URL was corrupted");
				for (const kind of ["ssh", "wsl"]) {
					const remoteUrl =
						"file:///home/user/My%20Pages/%E6%8A%A5%E5%91%8A.html";
					const before = calls.length;
					render(kind, `[Remote report](${remoteUrl})`).click();
					await new Promise(requestAnimationFrame);
					assert(
						calls.length === before + 1,
						`${kind} click must invoke exactly once`,
					);
					assert(
						calls.at(-1).command === "project_file_link_open",
						"Wrong remote command",
					);
					assert(
						calls.at(-1).args.projectId === `${kind}-project`,
						"Remote connection scope lost",
					);
					assert(
						calls.at(-1).args.url === new URL(remoteUrl).href,
						"Remote URL was corrupted",
					);
					assert(
						calls.at(-1).args.preview === false,
						"Remote HTML must use system opening",
					);
					for (const extension of ["md", "rs"]) {
						const textUrl = `file:///home/user/notes.${extension}`;
						render(kind, `[Remote source](${textUrl})`).click();
						await new Promise(requestAnimationFrame);
						assert(
							calls.at(-1).args.preview === true,
							"Remote text must use preview",
						);
						assert(
							previews.at(-1).projectId === `${kind}-project`,
							"Preview project scope lost",
						);
						assert(
							previews.at(-1).file.path === new URL(textUrl).pathname,
							"Preview path lost",
						);
						assert(
							previews.at(-1).file.content === "# Remote preview",
							"Preview content lost",
						);
					}
					await openHtmlReport(
						{ id: `${kind}-project`, connection: { kind: { type: kind } } },
						remoteUrl,
					);
					assert(
						calls.at(-1).command === "project_html_report_open",
						"Legacy HTML command lost",
					);
					assert(
						calls.at(-1).args.projectId === `${kind}-project`,
						"Legacy connection scope lost",
					);
				}
				render("ssh", "[Missing](file:///home/user/missing.html)").click();
				await new Promise(requestAnimationFrame);
				assert(
					toast.getHistory().at(-1).description.includes("missing remote file"),
					"Remote error lost",
				);
				globalThis.isTauri = false;
				const beforeWeb = calls.length;
				for (const kind of ["local", "ssh", "wsl"]) {
					render(kind).click();
					await new Promise(requestAnimationFrame);
					assert(
						calls.length === beforeWeb,
						"WebUI must never call desktop IPC",
					);
					assert(
						toast.getHistory().at(-1).description.includes("WebUI"),
						"Missing WebUI hint",
					);
					await openHtmlReport(
						{ id: "project", connection: { kind: { type: kind } } },
						url,
					).then(
						() => {
							throw new Error("WebUI must reject legacy native opening");
						},
						(error) =>
							assert(
								error.message.includes("WebUI"),
								"Wrong legacy WebUI guard",
							),
					);
				}
				const mobile = render("local");
				assert(
					!document.querySelector('a[href^="file:"]'),
					"Navigable file URL leaked",
				);
				assert(
					mobile.getBoundingClientRect().width <= 320,
					"Narrow screen overflow",
				);
				assert(
					mobile.getBoundingClientRect().height >= 24,
					"Hit target too small",
				);
				if (matchMedia("(pointer: coarse)").matches)
					assert(
						mobile.getBoundingClientRect().height >= 44,
						"Touch target too small",
					);
				const longUrl = `file:///Users/example/${"directory/".repeat(20)}${"long-report-".repeat(20)}.html`;
				for (const dark of [false, true]) {
					document.documentElement.classList.toggle("dark", dark);
					for (const [target, filename] of [
						[url, "报告.html"],
						[longUrl, `${"long-report-".repeat(20)}.html`],
					]) {
						const report = render("local", `[${target}](${target})`);
						assert(
							report.textContent === filename,
							"Raw URL must show only the decoded filename",
						);
						assert(
							report.title === new URL(target).href,
							"Full path must remain available",
						);
						assert(
							report.getBoundingClientRect().width <= 320,
							"Long filename overflows narrow layout",
						);
						const label = report.querySelector("span");
						assert(
							getComputedStyle(label).textOverflow === "ellipsis",
							"Long labels must truncate",
						);
						assert(
							report.querySelectorAll('svg[aria-hidden="true"]').length === 2,
							"Decorative icons must stay out of the accessible name",
						);
					}
				}
				document.documentElement.classList.remove("dark");
				for (const native of [true, false]) {
					globalThis.isTauri = native;
					for (const mode of ["static", "streaming"]) {
						for (const markdown of [
							"[Report](file:///tmp/report.html) Report",
							'<a href="file:///tmp/report.html">Report</a> Report',
							"[file:///tmp/private-folder/Report.html](file:///tmp/private-folder/Report.html) Report",
						]) {
							render("local", markdown, mode);
							const container = document.querySelector("#root");
							const message = container.querySelector(".markdown-renderer");
							message.dataset.messageId = "report";
							message.dataset.messageRole = "assistant";
							message.firstElementChild.dataset.chatSearchContentId =
								"report-text";
							const matches = findMessageMatches(
								[{ id: "report", role: "assistant", text: markdown, time: "" }],
								"Report",
							);
							assert(
								matches.length === 2,
								"File link must produce two indexed hits",
							);
							matches.forEach((match, index) => {
								assert(
									applyTextHighlight(container, "Report", match),
									`Missing active file-link hit ${index}`,
								);
								assert(
									CSS.highlights.get("pilo-find").size === 2,
									"DOM/index hit counts differ",
								);
								const range = [...CSS.highlights.get("pilo-find-active")][0];
								assert(
									Boolean(
										range.startContainer.parentElement.closest("button"),
									) ===
										(index === 0),
									"File-link hit order is wrong",
								);
							});
							assert(
								findMessageMatches(
									[
										{
											id: "report",
											role: "assistant",
											text: markdown,
											time: "",
										},
									],
									"private-folder",
								).length === 0,
								"Hidden path was indexed",
							);
							applyTextHighlight(container, "private-folder");
							assert(
								!CSS.highlights.has("pilo-find"),
								"Hidden path received a DOM highlight",
							);
						}
					}
				}
				clearTextHighlight();
				render(
					"local",
					`报告已生成。\n\n[file:///Users/chen/Code/Github/pilo/.trellis/.runtime/answers/pilo-analysis.html](file:///Users/chen/Code/Github/pilo/.trellis/.runtime/answers/pilo-analysis.html)\n\n也可以[查看报告](${url})。\n\n[${longUrl}](${longUrl})`,
				);
				document.body.dataset.testStatus = "passed";
				document.getElementById("results").textContent =
					"PASS: Local/SSH/WSL IPC, remote text tabs and errors, legacy HTML IPC, WebUI guard, focus, light/dark filename chips, narrow layout, no automatic navigation and two ordered file-link search highlights in static/streaming desktop/WebUI Markdown.";
			} catch (error) {
				document.body.dataset.testStatus = "failed";
				document.getElementById("results").textContent = String(
					error.stack ?? error,
				);
				throw error;
			} finally {
				globalThis.isTauri = originalIsTauri;
				window.__TAURI_INTERNALS__ = originalInternals;
			}
		</script>
	</body>
</html>
