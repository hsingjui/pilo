<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>Theme token editor regression</title>
	</head>
	<body>
		<pre id="results" style="white-space: pre-wrap">Running…</pre>
		<div id="root" style="max-width: 900px; margin: auto; padding: 12px"></div>
		<script type="module">
			import "../../web/index.css";
			import { createElement as h, useEffect } from "react";
			import { createRoot } from "react-dom/client";
			import {
				ThemeProvider,
				useTheme,
			} from "../../web/lib/theme-provider.tsx";
			import { AppearanceSettings } from "../../web/components/settings/appearance-settings.tsx";
			import { RemoteAppearanceSettings } from "../../web/remote/remote-appearance-settings.tsx";
			import { useRemoteTheme } from "../../web/remote/use-remote-theme.ts";
			import { initializeI18n } from "../../web/i18n/index.ts";
			await initializeI18n("en-US");
			document.documentElement.classList.add("pilo-browser");
			document.documentElement.dataset.remoteWebui = "";
			const legacy = new URLSearchParams(location.search).has("legacy");
			const conversion = {
				current: [
					{
						kind: "rule",
						reason: "unsupported-selector",
						selector: ".custom-card:hover",
						text: ".custom-card:hover { box-shadow: 0 8px 24px #0003; }",
					},
				],
				savedThemes: [
					{
						name: "Recovered",
						issues: [
							{
								kind: "rule",
								reason: "unsupported-at-rule",
								text: "@media (prefers-reduced-motion: reduce) {\n  .custom-card { transition: none; }\n}",
							},
							{
								kind: "declaration",
								reason: "unknown-token",
								selector: ":root",
								text: "--custom-accent-shadow: 0 8px 24px rgba(51, 102, 153, 0.2);",
							},
							{
								kind: "declaration",
								reason: "appearance-not-allowed",
								selector: ":root.dark",
								text: "--pilo-bubble-radius: 1.5rem;",
							},
						],
					},
				],
			};
			let settings = {
				revision: 1,
				theme: "light",
				themeFamily: "lody",
				themeCustomName: "",
				themeCustomCss: "body{display:none}",
				savedCustomThemes: [],
				...(legacy
					? {}
					: { themeCustomTokens: {}, themeCustomConversion: conversion }),
			};
			const updates = [];
			const client = {
				loadThemeSettings: async () => settings,
				saveThemeSettings: async (update) => {
					if (Object.hasOwn(update, "themeCustomConversion"))
						throw new Error("Read-only diagnostics in update");
					if (
						legacy &&
						(Object.hasOwn(update, "themeCustomTokens") ||
							Object.hasOwn(update.saveCustomTheme ?? {}, "tokens"))
					)
						throw new Error("Legacy Host rejects token keys");
					updates.push(update);
					settings = {
						...settings,
						...update,
						revision: settings.revision + 1,
					};
					if (update.saveCustomTheme) {
						const item = update.saveCustomTheme;
						const css =
							item.css ??
							settings.savedCustomThemes.find(
								(entry) => entry.name === item.name.trim(),
							)?.css ??
							settings.themeCustomCss;
						settings = {
							...settings,
							...(legacy
								? {}
								: {
										themeCustomConversion: {
											current: [],
											savedThemes: conversion.savedThemes.filter(
												(entry) => entry.name !== item.name,
											),
										},
									}),
							themeCustomName: item.name.trim(),
							themeCustomCss: css,
							...(legacy ? {} : { themeCustomTokens: item.tokens }),
							savedCustomThemes: [
								...settings.savedCustomThemes.filter(
									(entry) => entry.name !== item.name,
								),
								{ ...item, css, name: item.name.trim() },
							],
						};
					}
					if (update.deleteCustomTheme)
						settings.savedCustomThemes = settings.savedCustomThemes.filter(
							(item) => item.name !== update.deleteCustomTheme,
						);
					return settings;
				},
			};
			const onError = () => false;
			function Fixture() {
				useRemoteTheme({ client, refreshKey: "test", onError });
				const theme = useTheme();
				useEffect(() => {
					window.themeFixture = { theme, updates, client };
				}, [theme]);
				return h(
					"div",
					null,
					h(RemoteAppearanceSettings),
					h(AppearanceSettings),
				);
			}
			createRoot(document.getElementById("root")).render(
				h(ThemeProvider, null, h(Fixture)),
			);
			const tick = () =>
				new Promise((resolve) =>
					requestAnimationFrame(() => requestAnimationFrame(resolve)),
				);
			const assert = (value, message) => {
				if (!value) throw new Error(message);
			};
			function input(label, value) {
				const el = document.querySelector(`input[aria-label="${label}"]`);
				assert(el, `Missing ${label}`);
				Object.getOwnPropertyDescriptor(
					HTMLInputElement.prototype,
					"value",
				).set.call(el, value);
				el.dispatchEvent(new Event("input", { bubbles: true }));
			}
			const save = () =>
				[...document.querySelectorAll("button")].find((el) =>
					/^(Save and apply|Update and apply)$/.test(el.textContent.trim()),
				);
			async function run() {
				await tick();
				await tick();
				assert(
					Boolean(document.querySelector('button[aria-label="Theme"]')) ===
						!legacy,
					"WebUI appearance entry must follow Host capability",
				);
				if (legacy) {
					assert(
						!document.querySelector('input[aria-label="Filter tokens"]'),
						"Legacy Host must not show tokens",
					);
					const css = 'textarea[aria-label="Custom CSS"]';
					const editCss = (value) => {
						const el = document.querySelector(css);
						Object.getOwnPropertyDescriptor(
							HTMLTextAreaElement.prototype,
							"value",
						).set.call(el, value);
						el.dispatchEvent(new Event("input", { bubbles: true }));
					};
					input("Theme name", "Legacy green");
					editCss(":root{--primary:120 60% 40%;}");
					await tick();
					save().click();
					await tick();
					await tick();
					assert(
						updates[0].saveCustomTheme.css.includes("120 60%"),
						"Legacy save must carry CSS",
					);
					assert(
						document
							.getElementById("pilo-custom-theme-css")
							.textContent.includes("120 60%"),
						"Legacy CSS must be injected",
					);
					editCss(":root{--primary:130 60% 40%;}");
					await tick();
					save().click();
					await tick();
					await tick();
					const choose = (text) =>
						[...document.querySelectorAll("button")]
							.find((el) => el.textContent.trim() === text)
							.click();
					choose("Lody");
					await tick();
					await tick();
					choose("Legacy green");
					await tick();
					await tick();
					assert(
						updates.at(-1).themeCustomCss.includes("130 60%"),
						"Legacy selection must carry CSS",
					);
					window.themeFixture.theme.updateThemeSettings({
						deleteCustomTheme: "Legacy green",
					});
					await tick();
					await tick();
					assert(
						window.themeFixture.theme.savedCustomThemes.length === 0,
						"Legacy delete failed",
					);
					assert(
						updates.every(
							(update) =>
								!Object.hasOwn(update, "themeCustomTokens") &&
								!Object.hasOwn(update.saveCustomTheme ?? {}, "tokens"),
						),
						"Legacy payload leaked tokens",
					);
					document.body.dataset.testStatus = "passed";
					document.getElementById("results").textContent =
						"PASS: legacy CSS editor, save/edit/select/delete, CSS injection, no token keys";
					return;
				}
				const search = document.querySelector(
					'input[aria-label="Filter tokens"]',
				);
				assert(
					document.body.textContent.includes("Unconverted CSS (1)") &&
						document.body.textContent.includes("Unsupported selector"),
					"Current theme conversion notice missing",
				);
				assert(
					search.placeholder === "Filter tokens",
					"Search needs a visible empty-state placeholder",
				);
				assert(
					document
						.querySelector(`label[for="${search.id}"]`)
						?.textContent.trim() === "Filter tokens",
					"Search needs a persistent visible label",
				);
				input("Theme name", "Ocean");
				input("Filter tokens", "primary");
				await tick();
				const style = () =>
					document.getElementById("pilo-custom-theme-css").textContent;
				const before = style();
				input("primary light", "not-a-color");
				await tick();
				assert(save().disabled, "Invalid input must disable save");
				assert(
					document.querySelector('[role="alert"]'),
					"Inline validation required",
				);
				const colorError = document.querySelector('[role="alert"]').textContent;
				assert(
					colorError.includes("Not a valid color") &&
						colorError.includes("rgb()/rgba()") &&
						colorError.includes("hsl()/hsla()") &&
						colorError.includes("transparent"),
					"Unparseable colors need accepted-form guidance",
				);
				assert(
					!colorError.includes("alpha = 1"),
					"Unparseable colors must not show an alpha error",
				);
				assert(
					style() === before && updates.length === 0,
					"Invalid draft changed applied theme",
				);
				input("primary light", "#33669980");
				await tick();
				assert(
					save().disabled && document.body.textContent.includes("opaque color"),
					"Alpha must block save",
				);
				input("primary light", "#336699");
				await tick();
				assert(!save().disabled, "Valid draft must enable save");
				save().click();
				await tick();
				await tick();
				assert(
					updates[0].saveCustomTheme.tokens.light.primary === "#336699",
					"Save must send tokens to Host client",
				);
				assert(
					!Object.hasOwn(updates[0].saveCustomTheme, "css") &&
						!Object.hasOwn(updates[0], "themeCustomCss"),
					"New token theme must omit CSS keys",
				);
				assert(
					style().includes("--primary:210 50% 40%"),
					"Saved token not applied",
				);
				assert(
					!document.body.textContent.includes("Unconverted CSS ("),
					"Notice must clear when Host reports no conversion issues after save",
				);
				assert(
					!Object.hasOwn(
						JSON.parse(localStorage.getItem("pilo.theme.v1")),
						"themeCustomConversion",
					),
					"Conversion diagnostics must never be cached",
				);
				input("primary light", "#446688");
				await tick();
				save().click();
				await tick();
				await tick();
				assert(
					updates.at(-1).saveCustomTheme.name === "Ocean" &&
						!Object.hasOwn(updates.at(-1).saveCustomTheme, "css") &&
						!Object.hasOwn(updates.at(-1), "themeCustomCss"),
					"Same-name token save must omit CSS keys",
				);
				input("Theme name", "Ocean copy");
				await tick();
				save().click();
				await tick();
				await tick();
				assert(
					updates.at(-1).saveCustomTheme.name === "Ocean copy" &&
						!Object.hasOwn(updates.at(-1).saveCustomTheme, "css"),
					"Renamed token save must omit CSS",
				);
				assert(
					settings.savedCustomThemes.every(
						(entry) => entry.css === "body{display:none}",
					),
					"Mock Host must retain CSS for existing and new names",
				);
				window.themeFixture.theme.applyThemeSettings({
					...settings,
					revision: settings.revision + 1,
					theme: "dark",
					themeCustomTokens: { light: { primary: "bad" } },
				});
				await tick();
				assert(style() === "", "Invalid Host tokens must be dropped");
				assert(
					window.themeFixture.theme.theme === "dark" &&
						window.themeFixture.theme.revision === settings.revision + 1 &&
						window.themeFixture.theme.savedCustomThemes.length === 2,
					"Invalid tokens must not drop mode, saved themes or revision",
				);
				window.themeFixture.theme.applyThemeSettings(settings);
				await tick();
				assert(
					window.themeFixture.theme.theme === "dark",
					"Stale revision must not overwrite newer invalid-token snapshot",
				);
				input("primary light", "bad-color");
				await tick();
				assert(save().disabled, "Invalid update must disable save");
				assert(
					document.documentElement.scrollWidth <= innerWidth,
					"Horizontal overflow",
				);
				settings = {
					...settings,
					revision: settings.revision + 3,
					theme: "light",
					themeCustomName: "",
					themeCustomTokens: {},
					themeCustomConversion: conversion,
					savedCustomThemes: [
						{
							name: "Recovered",
							css: ":root{--custom-accent-shadow: 0 8px 24px #0003;}",
							tokens: { light: { primary: "#336699" } },
						},
					],
				};
				window.themeFixture.theme.applyThemeSettings(settings);
				await tick();
				[...document.querySelectorAll("button")]
					.find((el) => el.textContent.trim() === "Recovered")
					.click();
				await tick();
				await tick();
				assert(
					document.body.textContent.includes("Unconverted CSS (3)") &&
						document.body.textContent.includes("Unknown theme token") &&
						!document.body.textContent.includes(".custom-card:hover"),
					"Saved theme must show its own conversion issues, not current issues",
				);
				input("Theme name", "Recovered copy");
				assert(
					!Object.hasOwn(updates.at(-1), "themeCustomCss"),
					"Token selection must omit current CSS",
				);
				window.themeFixture.theme.updateThemeSettings({
					themeCustomTokens: settings.themeCustomTokens,
				});
				await tick();
				await tick();
				assert(
					!Object.hasOwn(updates.at(-1), "themeCustomCss"),
					"Token-only update must omit current CSS",
				);
				const issueRegion = document.querySelector(
					'section[aria-label="Unconverted CSS details"]',
				);
				assert(
					issueRegion.tabIndex === 0,
					"Conversion details must be keyboard focusable",
				);
				issueRegion.focus();
				assert(
					document.activeElement === issueRegion,
					"Conversion region must take focus",
				);
				assert(
					getComputedStyle(issueRegion.querySelector("pre")).overflowWrap ===
						"anywhere",
					"CSS must wrap at spaces before breaking long words",
				);
				await tick();
				assert(
					document.body.textContent.includes("Unconverted CSS (3)"),
					"Renaming a draft must retain source conversion notice",
				);
				assert(
					updates.every(
						(update) => !Object.hasOwn(update, "themeCustomConversion"),
					),
					"Conversion leaked in updates",
				);
				assert(
					document.documentElement.scrollWidth <= innerWidth,
					"Conversion notice overflow",
				);
				document.body.dataset.testStatus = "passed";
				document.getElementById("results").textContent =
					"PASS: mocked Host load/save, validation, alpha, token rendering, invalid Host update, narrow layout, read-only conversion issues";
				scrollTo(0, 0);
			}
			run().catch((error) => {
				document.body.dataset.testStatus = "failed";
				document.getElementById("results").textContent = error.stack;
			});
		</script>
	</body>
</html>
