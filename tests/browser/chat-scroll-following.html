<!doctype html>
<!-- Run with pnpm exec vite, then open /tests/browser/chat-scroll-following.html. -->
<html lang="en" translate="no">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Chat scroll following regression</title>
	</head>
	<body>
		<pre id="results">Running…</pre>
		<div id="root"></div>
		<script type="module">
			import "../../src/index.css";
			import { createElement as h, createRef } from "react";
			import { createRoot } from "react-dom/client";
			import { createChatConversationStore } from "../../src/components/chat/chat-conversation-store.ts";
			import { createConversationState } from "../../src/lib/chat/conversation-reducer.ts";
			import { RemoteConversationViewport } from "../../src/remote/remote-conversation-viewport.tsx";
			import { PreferencesProvider } from "../../src/lib/preferences-provider.tsx";
			import { TooltipProvider } from "../../src/ui/tooltip.tsx";
			import { initializeI18n } from "../../src/i18n/index.ts";

			await initializeI18n("en-US");
			const root = createRoot(document.getElementById("root"));
			const viewportRef = createRef();
			const runtimeScrollRef = createRef();
			const failures = [];
			let sampling = false;
			let label = "";
			let session = 0;
			let sampledFrames = 0;
			let stopped = false;
			function assert(condition, message) {
				if (!condition) throw new Error(message);
			}
			async function settle(frames = 6) {
				for (let i = 0; i < frames; i++)
					await new Promise(requestAnimationFrame);
			}
			// A task posted from rAF samples after resize delivery, not the temporary
			// pre-resize geometry inside animation callbacks. Do not only check the
			// settled layout: the regression corrects itself on the next frame.
			const channel = new MessageChannel();
			channel.port1.onmessage = () => {
				if (!sampling) return;
				const viewport = runtimeScrollRef.current;
				const status = viewport?.querySelector("[data-chat-streaming-status]");
				if (!status) return;
				sampledFrames++;
				const statusRect = status.getBoundingClientRect();
				const viewportRect = viewport.getBoundingClientRect();
				if (
					!viewport.hasAttribute("data-chat-following") ||
					statusRect.bottom > viewportRect.bottom + 2 ||
					statusRect.top < viewportRect.top - 2
				) {
					failures.push(`${label}: status outside following viewport`);
				}
			};
			function sampleFrame() {
				if (stopped) return;
				channel.port2.postMessage(null);
				requestAnimationFrame(sampleFrame);
			}
			requestAnimationFrame(sampleFrame);
			function tool(index, status = "running", lines = 0) {
				return {
					id: `tool-${index}`,
					type: "tool",
					toolName: "bash",
					args: { command: `echo tool-${index}` },
					status,
					...(lines
						? {
								result: {
									content: [{ type: "text", text: "output\n".repeat(lines) }],
								},
							}
						: {}),
				};
			}
			function mountChat(width, history, initialContent) {
				const messages = Array.from({ length: history }, (_, i) => ({
					id: `history-${i}`,
					role: i % 2 ? "assistant" : "user",
					text: `History ${i}.\n\n`.repeat(3),
				}));
				messages.push({
					id: "user",
					role: "user",
					text: "Check scrolling during this reply.",
				});
				const conversationStore = createChatConversationStore();
				const base = createConversationState(messages);
				const active = {
					assistantMessageId: "live",
					firstRuntimeUserSeen: true,
				};
				function updateReply(content, finished = false) {
					const previous = conversationStore.getTimelineSnapshot();
					conversationStore.setSnapshot({
						...base,
						active: finished ? null : active,
						messages: [
							...messages,
							{
								id: "live",
								role: "assistant",
								text: "",
								content: [...content],
								streaming: !finished,
								...(finished ? { errorMessage: "Final error.\n".repeat(6) } : {}),
							},
						],
					});
					if (previous && !finished) {
						assert(
							conversationStore.getTimelineSnapshot() === previous,
							`${label}: streaming deltas must not replace the timeline`,
						);
					}
				}
				updateReply(initialContent);
				document.documentElement.toggleAttribute(
					"data-remote-webui",
					width === 360,
				);
				root.render(
					h(
						PreferencesProvider,
						null,
						h(
							TooltipProvider,
							null,
							h(
								"main",
								{
									className: "@container flex flex-col",
									style: { width, maxWidth: "100%", height: 560 },
								},
								h(RemoteConversationViewport, {
									key: session,
									ref: viewportRef,
									runtimeScrollRef,
									active: true,
									visualLive: true,
									sessionId: `case-${session}`,
									conversationStore,
									historyPrefix: [],
									effectiveLoadState: "ready",
									initialScrollTop: 0,
									initialSticky: true,
									onRetryHistory() {},
								}),
								h("textarea", {
									"aria-label": "Composer layout reference",
									className: "shrink-0",
									style: { height: 110 },
								}),
							),
						),
					),
				);
				return updateReply;
			}
			try {
				for (const width of [900, 360]) {
					for (const history of [0, 20]) {
						for (const kind of ["thinking", "parallel-tools", "mixed-tools"]) {
							session++;
							label = `${width}px / history=${history} / ${kind}`;
							const intro = {
								id: "intro",
								type: "text",
								text: "Reply.\n\n".repeat(8),
							};
							let content = [intro];
							const updateReply = mountChat(width, history, content);
							await settle(12);
							const startSamples = sampledFrames;
							sampling = true;
							// Exceed the progressive-work window so automatic reveal and nested
							// markdown commits exercise the resize-delivery depth limit too.
							for (let i = 0; i < 12; i++) {
								if (kind === "thinking") {
									content.push({
										id: `thought-${i}`,
										type: "thinking",
										status: "complete",
										text: `Thought ${i}.`,
									});
								} else {
									content.push(tool(i));
								}
								if (kind !== "parallel-tools") {
									content.push({
										id: `text-${i}`,
										type: "text",
										text: `Paragraph ${i}.\n\n`,
									});
								}
							}
							updateReply(content);
							await settle(24);
							if (kind === "parallel-tools") {
								content = content.map((item) =>
									item.id === "tool-11" ? tool(11, "running", 1) : item,
								);
								updateReply(content);
								await settle();
								const viewport = runtimeScrollRef.current;
								const buttons = viewport.querySelectorAll("button.group\\/tool");
								const lastTool = buttons[buttons.length - 1];
								// Expanding a tool yields follow ownership to the disclosure anchor.
								sampling = false;
								lastTool.click();
								assert(
									lastTool.getAttribute("aria-expanded") === "true",
									`${label}: last tool must expand`,
								);
								assert(
									!viewport.hasAttribute("data-chat-following"),
									`${label}: expanding a tool must release follow ownership`,
								);
								await settle();
								viewportRef.current.scrollToBottom();
								sampling = true;
								await settle();
								for (const lines of [4, 8, 16, 32]) {
									content = content.map((item) =>
										item.id === "tool-11" ? tool(11, "running", lines) : item,
									);
									updateReply(content);
									await settle();
								}
							}
							if (kind !== "thinking") {
								for (let i = 0; i < 12; i++) {
									content = content.map((item) =>
										item.id === `tool-${i}` ? tool(i, "complete", 20) : item,
									);
									updateReply(content);
									await settle(3);
								}
							}
							content = [
								...content,
								{
									id: "tail",
									type: "text",
									text: "Continued reply.\n\n".repeat(30),
								},
							];
							updateReply(content);
							await settle(24);
							sampling = false;
							assert(
								sampledFrames - startSamples >= 20,
								`${label}: live frames sampled`,
							);
							assert(failures.length === 0, failures[0]);

							const viewport = runtimeScrollRef.current;
							viewport.dispatchEvent(new WheelEvent("wheel", { deltaY: -200 }));
							viewport.scrollTop -= 200;
							await settle();
							const readingTop = viewport.scrollTop;
							assert(
								!viewport.hasAttribute("data-chat-following"),
								`${label}: reading ownership`,
							);
							content = [
								...content,
								{
									id: "reading-tail",
									type: "text",
									text: "More output.\n\n".repeat(40),
								},
							];
							updateReply(content);
							await settle(12);
							assert(
								viewport
									.querySelector('[data-chat-search-content-id="reading-tail"]')
									?.textContent.includes("More output."),
								`${label}: live row must render the delta while reading`,
							);
							assert(
								Math.abs(viewport.scrollTop - readingTop) <= 1,
								`${label}: growth must not pull a reader to bottom`,
							);
							viewportRef.current.scrollToBottom();
							await settle();
							updateReply(content, true);
							await settle(12);
							assert(
								viewport.querySelector('[role="alert"]').getBoundingClientRect()
									.bottom <= viewport.getBoundingClientRect().bottom,
								`${label}: turn-end error stays visible`,
							);
						}
					}
				}
				document.body.dataset.testStatus = "passed";
				document.getElementById("results").textContent =
					`PASS: ${sampledFrames} following frames; content bursts, parallel tools, reading ownership and turn-end errors in plain/virtualized wide/narrow chats`;
			} catch (error) {
				document.body.dataset.testStatus = "failed";
				document.getElementById("results").textContent = error.stack;
				throw error;
			} finally {
				stopped = true;
				sampling = false;
				channel.port1.close();
				channel.port2.close();
			}
		</script>
	</body>
</html>
