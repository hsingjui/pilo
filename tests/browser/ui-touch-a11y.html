<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Shared touch and accessibility regression</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module">
			import "../../src/index.css";
			import { createElement as h, useEffect, useState } from "react";
			import { createRoot } from "react-dom/client";
			import { initializeI18n } from "../../src/i18n/index.ts";
			import {
				PreferencesProvider,
				usePreferences,
			} from "../../src/lib/preferences-provider.tsx";
			import { ChatCopyButton } from "../../src/components/chat/chat-copy-button.tsx";
			import { ChatFindLayer } from "../../src/components/chat/chat-find-bar.tsx";
			import { MarkdownImage } from "../../src/components/chat/chat-markdown-image.tsx";
			import { PiExtensionUiDialog } from "../../src/components/chat/pi-extension-ui-dialog.tsx";
			import {
				Dialog,
				DialogContent,
				DialogTitle,
				DialogFooter,
				Button,
				TooltipProvider,
			} from "../../src/ui/index.ts";
			import { Toaster } from "../../src/ui/sonner.tsx";
			import { toast } from "sonner";
			import { bindHostPreferences } from "../../src/lib/host-preferences.ts";

			if (new URLSearchParams(location.search).has("remote"))
				document.documentElement.dataset.remoteWebui = "";
			await initializeI18n("en-US");
			function Fixture() {
				const [open, setOpen] = useState(false);
				const preferences = usePreferences();
				const { uiFontSize, setUiFontSize } = preferences;
				useEffect(() => {
					let snapshot = {
						revision: 1,
						values: { ...preferences, locale: "en-US" },
					};
					const binding = bindHostPreferences({
						load: async () => snapshot,
						patch: async (patch) => {
							snapshot = {
								revision: snapshot.revision + 1,
								values: { ...snapshot.values, ...patch },
							};
							return snapshot;
						},
					});
					return binding.dispose;
				}, []);
				return h(
					"main",
					{ style: { padding: 12 } },
					h("h1", null, "Shared UI regression"),
					h(
						"div",
						{ id: "copy", className: "group" },
						h(ChatCopyButton, { text: "Copy fixture" }),
					),
					h(
						"label",
						null,
						"Font size ",
						h(
							"select",
							{
								id: "font",
								value: uiFontSize,
								onChange: (event) => setUiFontSize(Number(event.target.value)),
							},
							[12, 14, 18].map((size) =>
								h("option", { key: size, value: size }, size),
							),
						),
					),
					h(
						"div",
						{ id: "find", style: { position: "relative", height: 80 } },
						h(ChatFindLayer, {
							active: true,
							open: true,
							onOpen() {},
							onClose() {},
							messages: [],
						}),
					),
					h(
						"div",
						{ id: "broken" },
						h(MarkdownImage, {
							src: `${location.origin}/missing-touch-image.png`,
							alt: "Broken external image",
							width: 240,
							height: 140,
						}),
					),
					h(
						"div",
						{ id: "loaded" },
						h(MarkdownImage, {
							src: `${location.origin}/assets/branding/icon.png`,
							alt: "Loaded external image",
							width: 100,
							height: 100,
						}),
					),
					h(PiExtensionUiDialog, {
						request: {
							id: "input",
							method: "input",
							title:
								"A long extension title that must wrap on a narrow phone viewport instead of becoming truncated",
							placeholder: "Response",
						},
						onRespond() {},
					}),
					h(PiExtensionUiDialog, {
						request: {
							id: "select",
							method: "select",
							title: "Choose an option",
							options: [
								"A long option that must wrap on a narrow phone viewport and remain fully readable before selecting it",
							],
						},
						onRespond() {},
					}),
					h(
						Button,
						{ id: "open-dialog", onClick: () => setOpen(true) },
						"Open tall dialog",
					),
					h(
						Button,
						{
							id: "toast",
							onClick: () =>
								toast.error("Fixture toast", { duration: Infinity }),
						},
						"Show toast",
					),
					h(
						Dialog,
						{ open, onOpenChange: setOpen },
						h(
							DialogContent,
							{ "aria-describedby": undefined },
							h(DialogTitle, null, "Tall dialog"),
							h("div", { style: { minHeight: 600 } }, "Scrollable body"),
							h(
								DialogFooter,
								null,
								h(Button, { id: "footer-action" }, "Footer action"),
							),
						),
					),
					h(Toaster),
				);
			}
			createRoot(document.getElementById("root")).render(
				h(PreferencesProvider, null, h(TooltipProvider, null, h(Fixture))),
			);
		</script>
	</body>
</html>
