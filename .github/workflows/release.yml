name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NSH_VERSION: "0.7.2"

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      nsh_manifest: ${{ steps.version.outputs.nsh_manifest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version metadata and prepare desktop update configuration
        id: version
        shell: bash
        env:
          NSH_UPDATE_PUBLIC_KEY: ${{ vars.NSH_UPDATE_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          def toml(path):
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))

          workspace = toml("Cargo.toml")["workspace"]
          version = workspace["package"]["version"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", version):
              raise SystemExit(f"Unsupported release version: {version!r}")

          def check(label, actual, expected=version):
              if actual != expected:
                  raise SystemExit(f"{label}: expected {expected!r}, got {actual!r}")

          desktop = toml("crates/pilo-desktop/Cargo.toml")["package"]
          check("crates/pilo-desktop/Cargo.toml", desktop["version"])
          nsh_manifest = json.loads(Path("nsh.json").read_text(encoding="utf-8"))
          check("nsh.json", nsh_manifest["version"])
          # Local dev runs against app.hsingjui.pilo.dev to stay isolated from installed Pilo.
          nsh_manifest["name"] = "Pilo"
          nsh_manifest["id"] = "app.hsingjui.pilo"
          check("web/nsh.json", json.loads(Path("web/nsh.json").read_text(encoding="utf-8"))["version"])
          members = [toml(f"{path}/Cargo.toml")["package"]["name"] for path in workspace["members"]]
          for path, names in [("Cargo.lock", members), ("crates/pilo-desktop/Cargo.lock", [*members, desktop["name"]])]:
              local_packages = {pkg["name"]: pkg["version"] for pkg in toml(path)["package"] if "source" not in pkg}
              for name in names:
                  check(f"{path} ({name})", local_packages.get(name))

          if os.environ["GITHUB_REF_TYPE"] == "tag":
              check("Release tag", os.environ["GITHUB_REF_NAME"], f"v{version}")

          public_key = os.environ["NSH_UPDATE_PUBLIC_KEY"].strip()
          if public_key:
              try:
                  if len(base64.b64decode(public_key, validate=True)) != 32:
                      raise ValueError()
              except ValueError:
                  raise SystemExit("NSH_UPDATE_PUBLIC_KEY must contain an nsh keygen .pub file")
              nsh_manifest["updater"] = {"github": os.environ["GITHUB_REPOSITORY"], "publicKey": public_key}
          elif os.environ["GITHUB_REF_TYPE"] == "tag":
              raise SystemExit("Missing GitHub Actions variable: NSH_UPDATE_PUBLIC_KEY")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"nsh_manifest={json.dumps(nsh_manifest)}", file=output)
          print(f"Building Pilo {version}")
          PY

  runtimes:
    name: Build server runtimes
    needs: preflight
    uses: ./.github/workflows/server-runtimes.yml

  webui:
    name: Package WebUI
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup nsh
        uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}

      - name: Build nsh WebUI
        run: node scripts/build-nsh-web.mjs

      - name: Upload WebUI
        uses: actions/upload-artifact@v7
        with:
          name: pilo-webui
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [preflight, runtimes, webui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            arch: x64
            nsh_asset: nsh-windows-x86_64.zip
          - platform: macos
            runner: macos-15
            arch: arm64
            nsh_asset: nsh-macos-arm64.tar.gz
          - platform: linux
            runner: ubuntu-24.04
            arch: x64
            nsh_asset: nsh-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ASSET: Pilo-v${{ needs.preflight.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_PROFILE_RELEASE_LTO: thin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-4-dev libssl-dev \
            libwayland-dev libwebkitgtk-6.0-dev pkg-config rpm

      - name: Configure Cargo for native binding generation
        shell: bash
        run: |
          mkdir -p "$CARGO_HOME" .nsh/rust
          cat .github/nsh-cargo.toml >> "$CARGO_HOME/config.toml"

      - name: Cache Cargo dependencies for the generated nsh workspace
        uses: Swatinem/rust-cache@v2
        with:
          # nsh writes this workspace during packaging, but builds into the root target/.
          workspaces: .nsh/rust -> ../../target
          key: nsh-${{ env.NSH_VERSION }}-${{ hashFiles('crates/pilo-desktop/Cargo.lock', '.github/nsh-cargo.toml') }}
          cache-bin: false
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Setup nsh
        uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}
          asset: ${{ matrix.nsh_asset }}

      - name: Download server runtimes
        uses: actions/download-artifact@v8
        with:
          name: pilo-server-runtimes
          path: resources

      - name: Download WebUI
        uses: actions/download-artifact@v8
        with:
          name: pilo-webui
          path: dist

      - name: Package desktop
        shell: bash
        env:
          TARGET: ${{ matrix.platform }}
          NSH_MANIFEST: ${{ needs.preflight.outputs.nsh_manifest }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NSH_MANIFEST" > nsh.json
          nsh package --target "$TARGET" --app-version "$VERSION" --out .nsh/release

      - name: Stage app resources
        shell: bash
        env:
          NSH_MANIFEST: ${{ needs.preflight.outputs.nsh_manifest }}
        run: |
          set -euo pipefail
          bash scripts/verify-pilo-server-resources.sh
          test -s dist/index.html
          out=.nsh/release
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -d "$out/Pilo.app"
            app_resources="$out/Pilo.app/Contents/Resources"
          else
            test -d "$out/Pilo"
            app_resources="$out/Pilo"
          fi
          mkdir -p "$app_resources/runtime" release-assets
          cp -R dist "$app_resources/webui"
          cp resources/pilo-server-* "$app_resources/runtime/"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "$app_resources"/runtime/pilo-server-*
          fi
          # The CLI connects to the packaged app's ID by default and lives in bin/, not runtime/.
          app_id=$(python3 -c 'import json, os; print(json.loads(os.environ["NSH_MANIFEST"])["id"])')
          bash scripts/stage-pilo-cli.sh "$app_resources" "$app_id" "$VERSION"

      - name: Archive Windows portable app and compile installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $PWD '.nsh/release'
          $release = Join-Path $PWD 'release-assets'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # The portable ZIP is also the update archive for the installed app.
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $out 'Pilo'), (Join-Path $release "Pilo-Portable-$env:VERSION-windows-x86_64.zip"),
            [IO.Compression.CompressionLevel]::Optimal, $true)
          # nsh replaces the executable's directory. Keep Inno's uninstall files in its parent.
          $installer = Join-Path $out 'Pilo.iss'
          $script = (Get-Content -Raw -LiteralPath $installer).Replace('{app}', '{app}\pilo-app')
          # nsh 0.7.0 registers a deterministic COM toast activator in HKCU, but omits
          # AppUserModelToastActivatorCLSID from the Start Menu shortcut. Windows prefers
          # the shortcut PropertyStore over HKCU\Software\Classes\AppUserModelId, so
          # without this CLSID on the shortcut, toast clicks never invoke onPress.
          if ($script -notmatch 'AppUserModelToastActivatorCLSID') {
            $script = $script.Replace(
              'AppUserModelID: "app.hsingjui.pilo"',
              'AppUserModelID: "app.hsingjui.pilo"; AppUserModelToastActivatorCLSID: "58BCF293-2F89-430F-B5FA-7E0B41AFF62C"'
            )
          }
          # Keep Setup's RedirectionGuard enabled. A per-user postinstall launch
          # inherits it and cannot follow user-created junctions used by pnpm/mise.
          # Start Pilo from the installed shortcut instead.
          $postInstallLaunch = '(?m)^[ \t]*Filename:[ \t]*"\{app\}\\pilo-app\\Pilo\.exe";[^\r\n]*;[ \t]*Flags:[ \t]*[^\r\n]*\bpostinstall\b[^\r\n]*(?:\r?\n|$)'
          if ($script -notmatch $postInstallLaunch) {
            throw "Expected the Pilo postinstall launch in $installer"
          }
          $script = $script -replace $postInstallLaunch, ''
          $script += "`r`n" + @'
          [UninstallDelete]
          Type: filesandordirs; Name: "{app}\pilo-app"
          '@
          Set-Content -LiteralPath $installer -Value $script -Encoding utf8BOM
          & $iscc /Q "/O$release" "/F$env:ASSET-setup" $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ad hoc sign and archive macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          out=.nsh/release
          app="$out/Pilo.app"
          # The executable in Resources is sealed as data, not verified as nested code.
          codesign --verify --strict "$app/Contents/Resources/runtime/pilo-server-darwin-aarch64"
          codesign --verify --strict "$app/Contents/Resources/bin/pilo"
          # nsh signs before Pilo stages its resources; seal the finished bundle again.
          codesign --force --sign - --timestamp=none --preserve-metadata=entitlements "$app"
          codesign --verify --deep --strict "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -Fx 'Identifier=app.hsingjui.pilo'
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Contents/Info.plist"
          # The updater needs the final signed .app, not a DMG or nsh's initial archive.
          COPYFILE_DISABLE=1 tar -czf "release-assets/Pilo-$VERSION-macos-aarch64.tar.gz" -C "$out" Pilo.app
          python3 -m venv .nsh/dmgbuild
          .nsh/dmgbuild/bin/python -m pip install 'dmgbuild==2.0.0'
          .nsh/dmgbuild/bin/dmgbuild -s scripts/macos-dmg-settings.py -D app="$app" \
            Pilo "release-assets/$ASSET.dmg"

      - name: Archive Linux app and build deb, rpm and AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          app=.nsh/release/Pilo
          id=app.hsingjui.pilo
          # The updater archive; the system packages and AppImage below are read-only installs,
          # so the app sends their users to the release page instead of updating in place.
          tar -czf "release-assets/Pilo-$VERSION-linux-x86_64.tar.gz" -C .nsh/release Pilo
          test -x "$app/Pilo"
          test -s "$app/$id.desktop"
          test -s "$app/$id.png"
          # deb and rpm versions cannot contain '-'; '~' keeps prereleases older than the release.
          pkg_version=$(printf '%s' "$VERSION" | tr - '~')

          root="$RUNNER_TEMP/pilo-root"
          rm -rf "$root"
          mkdir -p "$root/opt" "$root/usr/bin" "$root/usr/share/applications" \
            "$root/usr/share/icons/hicolor/256x256/apps"
          cp -R "$app" "$root/opt/pilo"
          chmod -R u+rwX,go+rX,go-w "$root"
          ln -s /opt/pilo/Pilo "$root/usr/bin/pilo"
          sed 's|^Exec=Pilo|Exec=pilo|' "$app/$id.desktop" > "$root/usr/share/applications/$id.desktop"
          cp "$app/$id.png" "$root/usr/share/icons/hicolor/256x256/apps/$id.png"

          shlibs="$RUNNER_TEMP/pilo-shlibs"
          mkdir -p "$shlibs/debian"
          printf 'Source: pilo\n\nPackage: pilo\nArchitecture: amd64\n' > "$shlibs/debian/control"
          depends=$(cd "$shlibs" && dpkg-shlibdeps -O -e"$root/opt/pilo/Pilo")
          depends=${depends#shlibs:Depends=}
          test -n "$depends"
          mkdir "$root/DEBIAN"
          cat > "$root/DEBIAN/control" <<EOF
          Package: pilo
          Version: $pkg_version
          Architecture: amd64
          Maintainer: hsingjui <57979394+hsingjui@users.noreply.github.com>
          Installed-Size: $(du -sk --exclude=DEBIAN "$root" | cut -f1)
          Depends: $depends
          Section: devel
          Priority: optional
          Homepage: https://github.com/hsingjui/pilo
          Description: Desktop workspace for Pi Coding Agent
          EOF
          dpkg-deb -Zxz --root-owner-group --build "$root" "release-assets/$ASSET.deb"
          rm -rf "$root/DEBIAN"

          top="$RUNNER_TEMP/pilo-rpmbuild"
          mkdir -p "$top/SPECS"
          cat > "$top/SPECS/pilo.spec" <<EOF
          %global debug_package %{nil}
          %global __os_install_post %{nil}
          %global _build_id_links none
          # pilo-server binaries are for remote environments, not this machine.
          %global __requires_exclude_from ^/opt/pilo/runtime/.*\$
          Name: pilo
          Version: $pkg_version
          Release: 1
          Summary: Desktop workspace for Pi Coding Agent
          License: Apache-2.0
          URL: https://github.com/hsingjui/pilo
          AutoProv: no
          Requires: gtk4 >= 4.14
          Requires: webkitgtk6.0
          %description
          Desktop workspace for Pi Coding Agent.
          %install
          cp -a $root/. %{buildroot}/
          %files
          %defattr(-,root,root,-)
          /opt/pilo
          /usr/bin/pilo
          /usr/share/applications/$id.desktop
          /usr/share/icons/hicolor/256x256/apps/$id.png
          EOF
          rpmbuild -bb --target x86_64 --define "_topdir $top" "$top/SPECS/pilo.spec"
          rpm=$(find "$top/RPMS" -type f -name '*.rpm' -print -quit)
          test -s "$rpm"
          cp "$rpm" "release-assets/$ASSET.rpm"

          # Not self-contained: like the archive, it runs on the system's GTK 4 and WebKitGTK 6.
          appdir="$RUNNER_TEMP/Pilo.AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/lib"
          cp -R "$app" "$appdir/usr/lib/pilo"
          cp "$app/$id.desktop" "$app/$id.png" "$appdir/"
          ln -s "$id.png" "$appdir/.DirIcon"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          here=$(dirname "$(readlink -f "$0")")
          export PILO_APPIMAGE=1
          exec "$here/usr/lib/pilo/Pilo" "$@"
          EOF
          chmod +x "$appdir/AppRun"
          tool="$RUNNER_TEMP/appimagetool"
          runtime="$RUNNER_TEMP/appimage-runtime-x86_64"
          curl -fsSL -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o "$runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          printf '%s  %s\n' \
            ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0 "$tool" \
            2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d "$runtime" \
            | sha256sum --check
          chmod +x "$tool"
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 "$tool" --runtime-file "$runtime" \
            "$appdir" "$RUNNER_TEMP/Pilo.AppImage"
          test -s "$RUNNER_TEMP/Pilo.AppImage"
          cp "$RUNNER_TEMP/Pilo.AppImage" "release-assets/$ASSET.AppImage"

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create GitHub Release draft
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: Pilo-v*
          path: release-assets
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install release signer
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pilo-release-signer" --ignore-scripts --no-audit --no-fund @tauri-apps/cli@2.11.4

      - name: Sign release packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?Missing GitHub Actions secret: TAURI_SIGNING_PRIVATE_KEY}"
          for package in release-assets/*; do
            test -s "$package"
            "$RUNNER_TEMP/pilo-release-signer/node_modules/.bin/tauri" signer sign "$package"
            test -s "$package.sig"
          done

      - name: Setup nsh manifest signer
        uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}

      - name: Generate and sign nsh update manifest
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NSH_MANIFEST: ${{ needs.preflight.outputs.nsh_manifest }}
          NSH_UPDATE_PRIVATE_KEY: ${{ secrets.NSH_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${NSH_UPDATE_PRIVATE_KEY:?Missing GitHub Actions secret: NSH_UPDATE_PRIVATE_KEY}"
          printf '%s\n' "$NSH_MANIFEST" > nsh.json
          key=$(mktemp "$RUNNER_TEMP/nsh-update-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$NSH_UPDATE_PRIVATE_KEY" > "$key"
          unset NSH_UPDATE_PRIVATE_KEY
          # nsh parses the bare version from archive names; the base URL uses the tag.
          archives=(
            "release-assets/Pilo-Portable-$VERSION-windows-x86_64.zip"
            "release-assets/Pilo-$VERSION-macos-aarch64.tar.gz"
            "release-assets/Pilo-$VERSION-linux-x86_64.tar.gz"
          )
          for archive in "${archives[@]}"; do test -s "$archive"; done
          nsh update-manifest --entry . --key "$key" --out release-assets \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            "${archives[@]}"
          test -s release-assets/latest.json
          test -s release-assets/latest.json.sig

      - name: Create draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          base_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          windows_installer="Pilo-$GITHUB_REF_NAME-windows-x64-setup.exe"
          windows_portable="Pilo-Portable-$VERSION-windows-x86_64.zip"
          macos_dmg="Pilo-$GITHUB_REF_NAME-macos-arm64.dmg"
          linux_archive="Pilo-$VERSION-linux-x86_64.tar.gz"
          linux_deb="Pilo-$GITHUB_REF_NAME-linux-x64.deb"
          linux_rpm="Pilo-$GITHUB_REF_NAME-linux-x64.rpm"
          linux_appimage="Pilo-$GITHUB_REF_NAME-linux-x64.AppImage"
          for file in "$windows_installer" "$windows_portable" "$macos_dmg" "$linux_archive" \
            "$linux_deb" "$linux_rpm" "$linux_appimage"; do
            if [[ ! -s "release-assets/$file" ]]; then
              echo "Missing release asset: $file" >&2
              exit 1
            fi
          done

          flags=(--draft --verify-tag --title "Pilo $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}" --notes-file - <<EOF
          ### 下载安装

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Windows x64 | [$windows_installer]($base_url/$windows_installer) | 安装版 |
          | Windows x64 | [$windows_portable]($base_url/$windows_portable) | 便携版，解压到独立目录后运行 |
          | macOS (Apple Silicon) | [$macos_dmg]($base_url/$macos_dmg) | 打开 DMG，将 Pilo 拖入「应用程序」 |
          | Linux x64 | [$linux_deb]($base_url/$linux_deb) | Debian / Ubuntu 安装包 |
          | Linux x64 | [$linux_rpm]($base_url/$linux_rpm) | Fedora 安装包 |
          | Linux x64 | [$linux_appimage]($base_url/$linux_appimage) | 便携版，赋予执行权限后运行，需要 GTK 4.14 和 WebKitGTK 6.0 |
          | Linux x64 | [$linux_archive]($base_url/$linux_archive) | 解压后运行，需要 GTK 4.14 或更新版本 |

          #### macOS 安装提示

          Pilo 未使用 Apple Developer ID 证书签名，也未经过 Apple 公证。如果 macOS 阻止打开，请先确认安装包来自本仓库的 GitHub Release，再在终端执行：

          \`\`\`bash
          xattr -rd com.apple.quarantine /Applications/Pilo.app
          \`\`\`

          #### Linux 更新提示

          deb、rpm 和 AppImage 版不在应用内直接更新，发现新版本时会打开对应的 Release 页面，请下载新包覆盖安装。
          EOF
