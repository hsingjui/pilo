name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NSH_VERSION: "0.6.1"

jobs:
  preflight:
    name: Validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      nsh_manifest: ${{ steps.version.outputs.nsh_manifest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version metadata and prepare desktop update configuration
        id: version
        shell: bash
        env:
          NSH_UPDATE_PUBLIC_KEY: ${{ vars.NSH_UPDATE_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          def toml(path):
              return tomllib.loads(Path(path).read_text(encoding="utf-8"))

          workspace = toml("Cargo.toml")["workspace"]
          version = workspace["package"]["version"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?", version):
              raise SystemExit(f"Unsupported release version: {version!r}")

          def check(label, actual, expected=version):
              if actual != expected:
                  raise SystemExit(f"{label}: expected {expected!r}, got {actual!r}")

          desktop = toml("crates/pilo-desktop/Cargo.toml")["package"]
          check("crates/pilo-desktop/Cargo.toml", desktop["version"])
          nsh_manifest = json.loads(Path("nsh.json").read_text(encoding="utf-8"))
          check("nsh.json", nsh_manifest["version"])
          check("web/nsh.json", json.loads(Path("web/nsh.json").read_text(encoding="utf-8"))["version"])
          members = [toml(f"{path}/Cargo.toml")["package"]["name"] for path in workspace["members"]]
          for path, names in [("Cargo.lock", members), ("crates/pilo-desktop/Cargo.lock", [*members, desktop["name"]])]:
              local_packages = {pkg["name"]: pkg["version"] for pkg in toml(path)["package"] if "source" not in pkg}
              for name in names:
                  check(f"{path} ({name})", local_packages.get(name))

          if os.environ["GITHUB_REF_TYPE"] == "tag":
              check("Release tag", os.environ["GITHUB_REF_NAME"], f"v{version}")

          public_key = os.environ["NSH_UPDATE_PUBLIC_KEY"].strip()
          if public_key:
              try:
                  if len(base64.b64decode(public_key, validate=True)) != 32:
                      raise ValueError()
              except ValueError:
                  raise SystemExit("NSH_UPDATE_PUBLIC_KEY must contain an nsh keygen .pub file")
              nsh_manifest["updater"] = {"github": os.environ["GITHUB_REPOSITORY"], "publicKey": public_key}
          elif os.environ["GITHUB_REF_TYPE"] == "tag":
              raise SystemExit("Missing GitHub Actions variable: NSH_UPDATE_PUBLIC_KEY")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"nsh_manifest={json.dumps(nsh_manifest)}", file=output)
          print(f"Building Pilo {version}")
          PY

  runtimes:
    name: Build server runtimes
    needs: preflight
    uses: ./.github/workflows/server-runtimes.yml

  build:
    name: Package ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [preflight, runtimes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2022
            arch: x64
            nsh_asset: nsh-windows-x86_64.zip
          - platform: macos
            runner: macos-15
            arch: arm64
            nsh_asset: nsh-macos-arm64.tar.gz
          - platform: linux
            runner: ubuntu-24.04
            arch: x64
            nsh_asset: nsh-linux-x86_64.tar.gz
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ASSET: Pilo-v${{ needs.preflight.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_PROFILE_RELEASE_LTO: thin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-4-dev libssl-dev \
            libwayland-dev libwebkitgtk-6.0-dev pkg-config

      - name: Setup nsh
        shell: bash
        env:
          NSH_ASSET: ${{ matrix.nsh_asset }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "v$NSH_VERSION" --repo longbridge/nsh \
            --pattern "$NSH_ASSET" --pattern "$NSH_ASSET.sha256"
          if command -v sha256sum >/dev/null; then
            sha256sum -c "$NSH_ASSET.sha256"
          else
            shasum -a 256 -c "$NSH_ASSET.sha256"
          fi
          case "$NSH_ASSET" in
            *.zip) unzip -q "$NSH_ASSET" ;;
            *.tar.gz) tar -xzf "$NSH_ASSET" ;;
          esac
          ./nsh/bin/nsh --version
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cygpath -w "$PWD/nsh/bin" >> "$GITHUB_PATH"
          else
            echo "$PWD/nsh/bin" >> "$GITHUB_PATH"
          fi

      - name: Download server runtimes
        uses: actions/download-artifact@v8
        with:
          name: pilo-server-runtimes
          path: resources

      - name: Build nsh WebUI
        run: node scripts/build-nsh-web.mjs

      - name: Package desktop
        shell: bash
        env:
          TARGET: ${{ matrix.platform }}
          NSH_MANIFEST: ${{ needs.preflight.outputs.nsh_manifest }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NSH_MANIFEST" > nsh.json
          nsh package --target "$TARGET" --app-version "$VERSION" --out .nsh/release

      - name: Stage app resources
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-pilo-server-resources.sh
          test -s dist/index.html
          out=.nsh/release
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -d "$out/Pilo.app"
            app_resources="$out/Pilo.app/Contents/Resources"
          else
            test -d "$out/Pilo"
            app_resources="$out/Pilo"
          fi
          mkdir -p "$app_resources/runtime" release-assets
          cp -R dist "$app_resources/webui"
          cp resources/pilo-server-* "$app_resources/runtime/"
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x "$app_resources"/runtime/pilo-server-*
          fi

      - name: Archive Windows portable app and compile installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = Join-Path $PWD '.nsh/release'
          $release = Join-Path $PWD 'release-assets'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # The portable ZIP is also the update archive for the installed app.
          [IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $out 'Pilo'), (Join-Path $release "Pilo-Portable-$env:VERSION-windows-x86_64.zip"),
            [IO.Compression.CompressionLevel]::Optimal, $true)
          # nsh replaces the executable's directory. Keep Inno's uninstall files in its parent.
          $installer = Join-Path $out 'Pilo.iss'
          $script = (Get-Content -Raw -LiteralPath $installer).Replace('{app}', '{app}\pilo-app')
          $script += "`r`n" + @'
          [UninstallDelete]
          Type: filesandordirs; Name: "{app}\pilo-app"
          '@
          Set-Content -LiteralPath $installer -Value $script -Encoding utf8BOM
          & $iscc /Q "/O$release" "/F$env:ASSET-setup" $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ad hoc sign and archive macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          out=.nsh/release
          app="$out/Pilo.app"
          # The executable in Resources is sealed as data, not verified as nested code.
          codesign --verify --strict "$app/Contents/Resources/runtime/pilo-server-darwin-aarch64"
          # nsh signs before Pilo stages its resources; seal the finished bundle again.
          codesign --force --sign - --timestamp=none --preserve-metadata=entitlements "$app"
          codesign --verify --deep --strict "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -Fx 'Identifier=app.hsingjui.pilo'
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$app/Contents/Info.plist"
          # The updater needs the final signed .app, not a DMG or nsh's initial archive.
          COPYFILE_DISABLE=1 tar -czf "release-assets/Pilo-$VERSION-macos-aarch64.tar.gz" -C "$out" Pilo.app
          python3 -m venv .nsh/dmgbuild
          .nsh/dmgbuild/bin/python -m pip install 'dmgbuild==2.0.0'
          .nsh/dmgbuild/bin/dmgbuild -s scripts/macos-dmg-settings.py -D app="$app" \
            Pilo "release-assets/$ASSET.dmg"

      - name: Archive Linux app
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "release-assets/Pilo-$VERSION-linux-x86_64.tar.gz" -C .nsh/release Pilo

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ASSET }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create GitHub Release draft
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download desktop packages
        uses: actions/download-artifact@v8
        with:
          pattern: Pilo-v*
          path: release-assets
          merge-multiple: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install release signer
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/pilo-release-signer" --ignore-scripts --no-audit --no-fund @tauri-apps/cli@2.11.4

      - name: Sign release packages
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${TAURI_SIGNING_PRIVATE_KEY:?Missing GitHub Actions secret: TAURI_SIGNING_PRIVATE_KEY}"
          for package in release-assets/*; do
            test -s "$package"
            "$RUNNER_TEMP/pilo-release-signer/node_modules/.bin/tauri" signer sign "$package"
            test -s "$package.sig"
          done

      - name: Setup nsh manifest signer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          asset=nsh-linux-x86_64.tar.gz
          gh release download "v$NSH_VERSION" --repo longbridge/nsh \
            --pattern "$asset" --pattern "$asset.sha256"
          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"
          echo "$PWD/nsh/bin" >> "$GITHUB_PATH"

      - name: Generate and sign nsh update manifest
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NSH_MANIFEST: ${{ needs.preflight.outputs.nsh_manifest }}
          NSH_UPDATE_PRIVATE_KEY: ${{ secrets.NSH_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${NSH_UPDATE_PRIVATE_KEY:?Missing GitHub Actions secret: NSH_UPDATE_PRIVATE_KEY}"
          printf '%s\n' "$NSH_MANIFEST" > nsh.json
          key=$(mktemp "$RUNNER_TEMP/nsh-update-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$NSH_UPDATE_PRIVATE_KEY" > "$key"
          unset NSH_UPDATE_PRIVATE_KEY
          # nsh parses the bare version from archive names; the base URL uses the tag.
          archives=(
            "release-assets/Pilo-Portable-$VERSION-windows-x86_64.zip"
            "release-assets/Pilo-$VERSION-macos-aarch64.tar.gz"
            "release-assets/Pilo-$VERSION-linux-x86_64.tar.gz"
          )
          for archive in "${archives[@]}"; do test -s "$archive"; done
          nsh update-manifest --entry . --key "$key" --out release-assets \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            "${archives[@]}"
          test -s release-assets/latest.json
          test -s release-assets/latest.json.sig

      - name: Create draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          base_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          windows_installer="Pilo-$GITHUB_REF_NAME-windows-x64-setup.exe"
          windows_portable="Pilo-Portable-$VERSION-windows-x86_64.zip"
          macos_dmg="Pilo-$GITHUB_REF_NAME-macos-arm64.dmg"
          linux_archive="Pilo-$VERSION-linux-x86_64.tar.gz"
          for file in "$windows_installer" "$windows_portable" "$macos_dmg" "$linux_archive"; do
            if [[ ! -s "release-assets/$file" ]]; then
              echo "Missing release asset: $file" >&2
              exit 1
            fi
          done

          flags=(--draft --verify-tag --title "Pilo $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}" --notes-file - <<EOF
          ### 下载安装

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Windows x64 | [$windows_installer]($base_url/$windows_installer) | 安装版 |
          | Windows x64 | [$windows_portable]($base_url/$windows_portable) | 便携版，解压到独立目录后运行 |
          | macOS (Apple Silicon) | [$macos_dmg]($base_url/$macos_dmg) | 打开 DMG，将 Pilo 拖入「应用程序」 |
          | Linux x64 | [$linux_archive]($base_url/$linux_archive) | 解压后运行，需要 GTK 4.14 或更新版本 |

          #### macOS 安装提示

          Pilo 未使用 Apple Developer ID 证书签名，也未经过 Apple 公证。如果 macOS 阻止打开，请先确认安装包来自本仓库的 GitHub Release，再在终端执行：

          \`\`\`bash
          xattr -rd com.apple.quarantine /Applications/Pilo.app
          \`\`\`
          EOF
