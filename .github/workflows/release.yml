name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(awk '
            /^\[workspace\.package\]$/ { in_package=1; next }
            /^\[/ && in_package { exit }
            in_package && /^version = / {
              gsub(/^version = \"|\"$/, "")
              print
              exit
            }
          ' Cargo.toml)

          if [ -z "$VERSION" ]; then
            echo "Missing [workspace.package].version in Cargo.toml" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Release tag $GITHUB_REF_NAME does not match app version $VERSION" >&2
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Pilo $VERSION"

  runtimes:
    name: Build server runtimes
    needs: preflight
    uses: ./.github/workflows/server-runtimes.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.artifact }}
    needs: [preflight, runtimes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: ""
            args: ""
            arch: x64
            artifact: Pilo-windows-x64-installed
          - platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            arch: arm64
            artifact: Pilo-macos-arm64
          - platform: ubuntu-22.04
            target: ""
            args: --bundles deb,rpm,appimage
            arch: x64
            artifact: Pilo-linux-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
      CARGO_PROFILE_RELEASE_LTO: thin
      # 发布包必须包含全部四平台的 pilo-server 运行时；本地单平台构建不需要。
      PILO_REQUIRE_FULL_SERVER_BUNDLE: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Install Rust target
        if: matrix.target != ''
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            rpm \
            wget

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pilo-release-${{ matrix.artifact }}
          save-if: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download server runtimes
        uses: actions/download-artifact@v8
        with:
          name: pilo-server-runtimes
          path: src-tauri/resources

      - name: Restore Unix runtime executable bits
        if: runner.os != 'Windows'
        shell: bash
        run: chmod 755 src-tauri/resources/pilo-server-linux-* src-tauri/resources/pilo-server-darwin-*

      - name: Verify server runtimes
        shell: bash
        run: bash scripts/verify-pilo-server-resources.sh

      - name: Validate updater signing configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "Missing GitHub Actions secret: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Build Tauri app
        shell: bash
        run: pnpm tauri build ${{ matrix.args }}

      - name: Test Linux AppImage finalization
        if: runner.os == 'Linux'
        run: python3 tests/packaging/test-linux-appimage.py

      - name: Finalize and sign Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR='target/release/bundle/appimage'
          APPIMAGE=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          PRODUCT_NAME=$(jq -r '.productName' src-tauri/tauri.conf.json)
          TOOLS_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          bash scripts/finalize-linux-appimage.sh \
            "$APPIMAGE" "$BUNDLE_DIR/${PRODUCT_NAME}.AppDir" \
            src-tauri/resources "$TOOLS_DIR/linuxdeploy-plugin-appimage.AppImage"
          pnpm tauri signer sign "$APPIMAGE"

      - name: Prepare Windows installed assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.preflight.outputs.version }}'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $nsis = Get-ChildItem -Path 'target/release/bundle/nsis' -Filter '*-setup.exe' -Recurse | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS bundle was not produced' }
          Copy-Item $nsis.FullName "release-assets/Pilo-v$version-x64-setup.exe"

          $nsisSig = Get-Item "$($nsis.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $nsisSig) { throw 'NSIS updater signature was not produced' }
          Copy-Item $nsisSig.FullName "release-assets/Pilo-v$version-x64-setup.exe.sig"

      - name: Prepare Windows portable assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.preflight.outputs.version }}'
          $portableDir = 'release-assets/Pilo-Portable'
          New-Item -ItemType Directory -Force -Path "$portableDir/runtime" | Out-Null
          New-Item -ItemType Directory -Force -Path "$portableDir/icons" | Out-Null

          $exe = Get-Item 'target/release/pilo.exe' -ErrorAction Stop
          Copy-Item $exe.FullName "$portableDir/Pilo.exe"
          Copy-Item 'src-tauri/resources/*' "$portableDir/runtime/" -Recurse
          Copy-Item 'src-tauri/icons/128x128.png' "$portableDir/icons/128x128.png"

          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/Pilo-v$version-x64-Portable.zip" -Force
          Remove-Item -Recurse -Force $portableDir

      - name: Prepare macOS assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.preflight.outputs.version }}'
          TARGET='${{ matrix.target }}'
          ARCH='${{ matrix.arch }}'
          BUNDLE_DIR="target/${TARGET}/release/bundle"
          mkdir -p release-assets

          DMG=$(find "$BUNDLE_DIR/dmg" -type f -name '*.dmg' -print -quit)
          if [ -z "$DMG" ]; then
            echo "DMG bundle was not produced under $BUNDLE_DIR" >&2
            exit 1
          fi
          cp "$DMG" "release-assets/Pilo-v${VERSION}-${ARCH}.dmg"

          UPDATER=$(find "$BUNDLE_DIR/macos" -type f -name '*.app.tar.gz' -print -quit)
          if [ -z "$UPDATER" ]; then
            echo "macOS updater bundle was not produced under $BUNDLE_DIR" >&2
            exit 1
          fi
          if [ ! -f "${UPDATER}.sig" ]; then
            echo "macOS updater signature was not produced for $UPDATER" >&2
            exit 1
          fi
          cp "$UPDATER" "release-assets/Pilo-v${VERSION}-${ARCH}.app.tar.gz"
          cp "${UPDATER}.sig" "release-assets/Pilo-v${VERSION}-${ARCH}.app.tar.gz.sig"

      - name: Prepare Linux assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.preflight.outputs.version }}'
          BUNDLE_DIR='target/release/bundle'
          mkdir -p release-assets

          DEB=$(find "$BUNDLE_DIR/deb" -type f -name '*.deb' -print -quit)
          RPM=$(find "$BUNDLE_DIR/rpm" -type f -name '*.rpm' -print -quit)
          APPIMAGE=$(find "$BUNDLE_DIR/appimage" -type f -name '*.AppImage' -print -quit)

          for ASSET in "$DEB" "$RPM" "$APPIMAGE"; do
            if [ -z "$ASSET" ] || [ ! -f "$ASSET" ]; then
              echo "Required Linux bundle was not produced under $BUNDLE_DIR" >&2
              exit 1
            fi
          done
          if [ ! -f "${APPIMAGE}.sig" ]; then
            echo "Linux updater signature was not produced for $APPIMAGE" >&2
            exit 1
          fi

          cp "$DEB" "release-assets/Pilo-v${VERSION}-x64.deb"
          cp "$RPM" "release-assets/Pilo-v${VERSION}-x64.rpm"
          cp "$APPIMAGE" "release-assets/Pilo-v${VERSION}-x64.AppImage"
          cp "${APPIMAGE}.sig" "release-assets/Pilo-v${VERSION}-x64.AppImage.sig"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Prepare GitHub Release draft
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Pilo-*
          path: release-assets
          merge-multiple: true

      - name: Generate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.preflight.outputs.version }}'
          TAG='${{ github.ref_name }}'
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          WIN_SIG=$(cat "release-assets/Pilo-v${VERSION}-x64-setup.exe.sig")
          MAC_ARM_SIG=$(cat "release-assets/Pilo-v${VERSION}-arm64.app.tar.gz.sig")
          LINUX_X64_SIG=$(cat "release-assets/Pilo-v${VERSION}-x64.AppImage.sig")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "Pilo ${TAG} 更新" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg win_url "$BASE_URL/Pilo-v${VERSION}-x64-setup.exe" \
            --arg win_sig "$WIN_SIG" \
            --arg mac_arm_url "$BASE_URL/Pilo-v${VERSION}-arm64.app.tar.gz" \
            --arg mac_arm_sig "$MAC_ARM_SIG" \
            --arg linux_x64_url "$BASE_URL/Pilo-v${VERSION}-x64.AppImage" \
            --arg linux_x64_sig "$LINUX_X64_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { url: $win_url, signature: $win_sig },
                "darwin-aarch64": { url: $mac_arm_url, signature: $mac_arm_sig },
                "linux-x86_64": { url: $linux_x64_url, signature: $linux_x64_sig }
              }
            }' > release-assets/latest.json

      - name: List release assets
        run: ls -lah release-assets

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Pilo ${{ github.ref_name }}
          generate_release_notes: false
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append download section to release body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          VERSION='${{ needs.preflight.outputs.version }}'
          REPO='${{ github.repository }}'

          EXISTING_BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')

          if echo "$EXISTING_BODY" | grep -q '### 下载安装'; then
            echo "下载安装说明已存在，跳过追加。"
            exit 0
          fi

          cat > download_section.md <<EOF

          ---

          ### 下载安装

          | 平台 | 文件 | 说明 |
          | --- | --- | --- |
          | Windows x64 | [Pilo-v${VERSION}-x64-setup.exe](https://github.com/${REPO}/releases/download/${TAG}/Pilo-v${VERSION}-x64-setup.exe) | 安装版 |
          | Windows x64 | [Pilo-v${VERSION}-x64-Portable.zip](https://github.com/${REPO}/releases/download/${TAG}/Pilo-v${VERSION}-x64-Portable.zip) | 便携版，解压后直接运行 |
          | macOS (Apple Silicon) | [Pilo-v${VERSION}-arm64.dmg](https://github.com/${REPO}/releases/download/${TAG}/Pilo-v${VERSION}-arm64.dmg) | Apple Silicon |
          | Linux x64 | [Pilo-v${VERSION}-x64.deb](https://github.com/${REPO}/releases/download/${TAG}/Pilo-v${VERSION}-x64.deb) | Debian / Ubuntu 安装包 |
          | Linux x64 | [Pilo-v${VERSION}-x64.rpm](https://github.com/${REPO}/releases/download/${TAG}/Pilo-v${VERSION}-x64.rpm) | Fedora / RHEL 系安装包 |
          | Linux x64 | [Pilo-v${VERSION}-x64.AppImage](https://github.com/${REPO}/releases/download/${TAG}/Pilo-v${VERSION}-x64.AppImage) | 便携版，赋予执行权限后运行 |

          #### macOS 安装提示

          Pilo 目前未使用 Apple Developer 证书签名和公证。若安装后被 macOS 阻止运行，请在终端执行：

          \`\`\`bash
          xattr -rd com.apple.quarantine /Applications/Pilo.app
          \`\`\`

          > \`.app.tar.gz\`、\`.sig\` 和 \`latest.json\` 为 Tauri 自动更新专用，无需手动下载。
          EOF

          printf '%s\n' "$EXISTING_BODY" > release_body.md
          cat download_section.md >> release_body.md

          gh release edit "$TAG" --repo "$REPO" --notes-file release_body.md

          echo "Updated release body:"
          cat release_body.md
