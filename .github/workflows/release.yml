name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(awk '
            /^\[workspace\.package\]$/ { in_package=1; next }
            /^\[/ && in_package { exit }
            in_package && /^version = / {
              gsub(/^version = \"|\"$/, "")
              print
              exit
            }
          ' Cargo.toml)

          if [ -z "$VERSION" ]; then
            echo "Missing [workspace.package].version in Cargo.toml" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "Release tag $GITHUB_REF_NAME does not match app version $VERSION" >&2
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Pilo $VERSION"

  runtimes:
    name: Build server runtimes
    needs: preflight
    uses: ./.github/workflows/server-runtimes.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.artifact }}
    needs: [preflight, runtimes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            target: ""
            args: ""
            arch: x64
            artifact: Pilo-windows-x64
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            arch: arm64
            artifact: Pilo-macos-arm64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust target
        if: matrix.target != ''
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: desktop-${{ matrix.artifact }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download server runtimes
        uses: actions/download-artifact@v8
        with:
          name: pilo-server-runtimes
          path: src-tauri/resources

      - name: Restore Unix runtime executable bits
        if: runner.os != 'Windows'
        shell: bash
        run: chmod 755 src-tauri/resources/pilo-server-linux-* src-tauri/resources/pilo-server-darwin-*

      - name: Verify server runtimes
        shell: bash
        run: bash scripts/verify-pilo-server-resources.sh

      - name: Validate updater signing configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "Missing GitHub Actions secret: TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Build Tauri app
        shell: bash
        run: pnpm tauri build ${{ matrix.args }}

      - name: Prepare Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ needs.preflight.outputs.version }}'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $nsis = Get-ChildItem -Path 'target/release/bundle/nsis' -Filter '*-setup.exe' -Recurse | Select-Object -First 1
          if (-not $nsis) { throw 'NSIS bundle was not produced' }
          Copy-Item $nsis.FullName "release-assets/Pilo-v$version-x64-setup.exe"

          $nsisSig = Get-Item "$($nsis.FullName).sig" -ErrorAction SilentlyContinue
          if (-not $nsisSig) { throw 'NSIS updater signature was not produced' }
          Copy-Item $nsisSig.FullName "release-assets/Pilo-v$version-x64-setup.exe.sig"

      - name: Prepare macOS assets
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.preflight.outputs.version }}'
          TARGET='${{ matrix.target }}'
          ARCH='${{ matrix.arch }}'
          BUNDLE_DIR="target/${TARGET}/release/bundle"
          mkdir -p release-assets

          DMG=$(find "$BUNDLE_DIR/dmg" -type f -name '*.dmg' -print -quit)
          if [ -z "$DMG" ]; then
            echo "DMG bundle was not produced under $BUNDLE_DIR" >&2
            exit 1
          fi
          cp "$DMG" "release-assets/Pilo-v${VERSION}-${ARCH}.dmg"

          UPDATER=$(find "$BUNDLE_DIR/macos" -type f -name '*.app.tar.gz' -print -quit)
          if [ -z "$UPDATER" ]; then
            echo "macOS updater bundle was not produced under $BUNDLE_DIR" >&2
            exit 1
          fi
          if [ ! -f "${UPDATER}.sig" ]; then
            echo "macOS updater signature was not produced for $UPDATER" >&2
            exit 1
          fi
          cp "$UPDATER" "release-assets/Pilo-v${VERSION}-${ARCH}.app.tar.gz"
          cp "${UPDATER}.sig" "release-assets/Pilo-v${VERSION}-${ARCH}.app.tar.gz.sig"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: Pilo-*
          path: release-assets
          merge-multiple: true

      - name: Generate updater manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ needs.preflight.outputs.version }}'
          TAG='${{ github.ref_name }}'
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          WIN_SIG=$(cat "release-assets/Pilo-v${VERSION}-x64-setup.exe.sig")
          MAC_ARM_SIG=$(cat "release-assets/Pilo-v${VERSION}-arm64.app.tar.gz.sig")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "Pilo ${TAG}" \
            --arg pub_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg win_url "$BASE_URL/Pilo-v${VERSION}-x64-setup.exe" \
            --arg win_sig "$WIN_SIG" \
            --arg mac_arm_url "$BASE_URL/Pilo-v${VERSION}-arm64.app.tar.gz" \
            --arg mac_arm_sig "$MAC_ARM_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { url: $win_url, signature: $win_sig },
                "darwin-aarch64": { url: $mac_arm_url, signature: $mac_arm_sig }
              }
            }' > release-assets/latest.json

      - name: List release assets
        run: ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pilo ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Append download section to release body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          VERSION='${{ needs.preflight.outputs.version }}'
          REPO='${{ github.repository }}'

          EXISTING_BODY=$(gh release view "$TAG" --repo "$REPO" --json body --jq '.body // ""')

          if echo "$EXISTING_BODY" | grep -q '### Download / 下载'; then
            echo "Download section already exists, skipping."
            exit 0
          fi

          cat > download_section.md <<EOF

          ---

          ### Download / 下载

          | Platform | File | Notes |
          | --- | --- | --- |
          | Windows x64 | [Pilo-v${VERSION}-x64-setup.exe](https://github.com/${REPO}/releases/download/${TAG}/Pilo-v${VERSION}-x64-setup.exe) | NSIS installer |
          | macOS (Apple Silicon) | [Pilo-v${VERSION}-arm64.dmg](https://github.com/${REPO}/releases/download/${TAG}/Pilo-v${VERSION}-arm64.dmg) | Apple Silicon |

          #### macOS installation note

          Pilo is not currently signed and notarized with an Apple Developer certificate. If macOS blocks the app after installation, run:

          \`\`\`bash
          xattr -rd com.apple.quarantine /Applications/Pilo.app
          \`\`\`

          > \`.app.tar.gz\`, \`.sig\`, and \`latest.json\` are used by Tauri auto-update and do not need to be downloaded manually.
          EOF

          printf '%s\n' "$EXISTING_BODY" > release_body.md
          cat download_section.md >> release_body.md

          gh release edit "$TAG" --repo "$REPO" --notes-file release_body.md

          echo "Updated release body:"
          cat release_body.md
