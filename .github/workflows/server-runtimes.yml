name: Server runtimes

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.lock"
      - "crates/pilo-protocol/**"
      - "crates/pilo-server/**"
      - "scripts/build-pilo-server.sh"
      - "scripts/verify-pilo-server-resources.sh"
      - ".github/workflows/server-runtimes.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            resource: pilo-server-linux-x86_64
          - target: linux-aarch64
            runner: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            resource: pilo-server-linux-aarch64
          - target: windows-x86_64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            resource: pilo-server-windows-x86_64.exe
          - target: darwin-aarch64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            resource: pilo-server-darwin-aarch64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'linux-aarch64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: pilo-server-${{ matrix.rust_target }}

      - name: Build runtime
        shell: bash
        run: bash scripts/build-pilo-server.sh "${{ matrix.target }}"

      - name: Inspect runtime
        shell: bash
        run: |
          test -s "src-tauri/resources/${{ matrix.resource }}"
          wc -c "src-tauri/resources/${{ matrix.resource }}"

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: pilo-server-${{ matrix.target }}
          path: src-tauri/resources/${{ matrix.resource }}
          if-no-files-found: error
          retention-days: 14

  bundle:
    name: Bundle runtime set
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download runtimes
        uses: actions/download-artifact@v8
        with:
          pattern: pilo-server-*
          path: src-tauri/resources
          merge-multiple: true

      - name: Verify complete runtime set
        shell: bash
        run: bash scripts/verify-pilo-server-resources.sh

      - name: Upload runtime set
        uses: actions/upload-artifact@v7
        with:
          name: pilo-server-runtimes
          path: src-tauri/resources/pilo-server-*
          if-no-files-found: error
          retention-days: 14
