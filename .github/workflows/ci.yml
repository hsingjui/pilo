name: CI

on:
  push:
    branches:
      - main
    tags:
      - "**"
  pull_request:
    # If main gains required checks, keep their workflow running for docs PRs
    # and skip the expensive jobs instead of filtering out the entire workflow.
    paths-ignore:
      - "**/README*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A shared group can replace pending runs even with cancel-in-progress: false.
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NSH_VERSION: "0.7.0"

jobs:
  frontend:
    name: Shared & WebUI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint and shared type-check
        run: pnpm check

      - name: Check generated themes and icons
        run: |
          pnpm generate:themes --check
          pnpm generate:icons --check

      - name: Node tests
        run: pnpm test

      - name: Setup nsh
        uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}

      - name: Package WebUI
        run: pnpm build:web

  nsh-desktop:
    name: Desktop nsh check
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libwayland-dev

      - name: Configure Cargo for native binding generation
        run: cat .github/nsh-cargo.toml >> "$CARGO_HOME/config.toml"

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pilo-desktop -> target
          key: nsh-${{ env.NSH_VERSION }}-${{ hashFiles('.github/nsh-cargo.toml') }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Setup nsh
        uses: ./.github/actions/setup-nsh
        with:
          version: ${{ env.NSH_VERSION }}

      - name: Check nsh apps
        # Both nsh's cargo check and its generated describe program use this cache.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/crates/pilo-desktop/target
        run: nsh check

  backend:
    name: Backend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/pilo-desktop/Cargo.toml --all --check

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file libssl-dev pkg-config wget

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Rust unit tests
        run: cargo test -p pilo-domain -p pilo-runtime

  desktop-rust:
    name: Desktop Rust checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libwayland-dev pkg-config

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pilo-desktop -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      - name: Clippy
        run: cargo clippy --manifest-path crates/pilo-desktop/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: cargo test --manifest-path crates/pilo-desktop/Cargo.toml
