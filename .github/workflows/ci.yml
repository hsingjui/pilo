name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Shared, desktop & WebUI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NSH_VERSION: "0.6.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format, lint and shared type-check
        run: pnpm check

      - name: Check generated themes and icons
        run: |
          pnpm generate:themes --check
          pnpm generate:icons --check

      - name: Node tests
        run: pnpm test

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libgtk-4-dev libssl-dev \
            libwayland-dev libwebkitgtk-6.0-dev pkg-config

      - name: Setup nsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          asset=nsh-linux-x86_64.tar.gz
          gh release download "v$NSH_VERSION" --repo longbridge/nsh \
            --pattern "$asset" --pattern "$asset.sha256"
          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"
          echo "$PWD/nsh/bin" >> "$GITHUB_PATH"

      - name: Check nsh apps
        run: nsh check

      - name: Package WebUI
        run: pnpm build:web

  backend:
    name: Backend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libssl-dev \
            libwayland-dev \
            pkg-config \
            wget

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/pilo-desktop -> crates/pilo-desktop/target

      - name: Check Rust formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path crates/pilo-desktop/Cargo.toml --all --check

      - name: Cargo check
        run: |
          cargo check --workspace --all-targets --all-features
          cargo check --manifest-path crates/pilo-desktop/Cargo.toml --all-targets

      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path crates/pilo-desktop/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit tests
        run: |
          cargo test -p pilo-domain -p pilo-runtime
          cargo test --manifest-path crates/pilo-desktop/Cargo.toml
