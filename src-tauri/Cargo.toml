[package]
name = "pilo"
version.workspace = true
description = "A simple desktop client for Pi Coding Agent"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pilo"
path = "src/main.rs"
required-features = ["tauri"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
default = ["tauri"]
tauri = [
	"dep:tauri-build",
	"dep:tauri",
	"dep:tauri-plugin-autostart",
	"dep:tauri-plugin-global-shortcut",
	"dep:tauri-plugin-single-instance",
	"dep:tauri-plugin-opener",
	"dep:tauri-plugin-window-state",
	"dep:tauri-plugin-notification",
	"dep:tauri-plugin-updater",
	"dep:tauri-plugin-process",
	"dep:tauri-plugin-log",
	"dep:tauri-winrt-notification",
	"dep:rfd",
	"dep:mac-notification-sys",
	"dep:glib",
]
webdriver = ["tauri", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
pilo-protocol = { path = "../crates/pilo-protocol" }
pilo-server = { path = "../crates/pilo-server" }
# Tauri 2.12 uses Tao >= 0.36, which respects KDE Wayland server-side decorations.
tauri = { version = "2.12", features = [
	"devtools",
	"tray-icon",
], optional = true }
# Keep the desktop integration plugin lines pinned to compatible minor releases.
tauri-plugin-autostart = { version = "~2.5.1", optional = true }
tauri-plugin-global-shortcut = { version = "~2.3.1", optional = true }
tauri-plugin-single-instance = { version = "~2.4.0", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
url = "2"
global-hotkey = "0.8"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.3"
sha2 = "0.10"
tower-http = { version = "0.6", features = ["timeout"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-notification = { version = "2.4.0", optional = true }
thiserror = "2"
# Without a native backend, keyring falls back to non-persistent per-entry mocks.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = [
	"fs",
	"io-util",
	"macros",
	"process",
	"rt",
	"sync",
	"time",
] }
rfd = { version = "0.15", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-wdio-webdriver = { version = "~1.5.0", optional = true }
tauri-plugin-log = { version = "2", optional = true }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = { version = "0.6.15", optional = true }
core-text = "22"

[target.'cfg(target_os = "linux")'.dependencies]
glib = { version = "0.18", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = { version = "0.7.3", optional = true }
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_DirectWrite",
	"Win32_Storage_EnhancedStorage",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Variant",
	"Win32_UI_Shell",
	"Win32_UI_Shell_PropertiesSystem",
] }
