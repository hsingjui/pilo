[package]
name = "pilo"
version.workspace = true
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pilo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
pilo-protocol = { path = "../crates/pilo-protocol" }
pilo-server = { path = "../crates/pilo-server" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.3"
sha2 = "0.10"
tower-http = { version = "0.6", features = ["timeout"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-notification = "2.4.0"
thiserror = "2"
keyring = { version = "3", features = ["windows-native"] }
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = [
	"fs",
	"io-util",
	"macros",
	"process",
	"rt",
	"sync",
	"time",
] }
rfd = "0.15"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tauri-plugin-log = "2"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6.15"
core-text = "22"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "0.7.3"
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_DirectWrite",
	"Win32_Storage_EnhancedStorage",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Variant",
	"Win32_UI_Shell",
	"Win32_UI_Shell_PropertiesSystem",
] }
