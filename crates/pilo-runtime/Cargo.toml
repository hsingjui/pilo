[package]
name = "pilo-runtime"
version.workspace = true
description = "Pilo Host runtime: connections, projects, sessions, Pi RPC and Remote WebUI"
edition = "2024"

[dependencies]
pilo-domain = { path = "../pilo-domain" }
pilo-protocol = { path = "../pilo-protocol" }
pilo-server = { path = "../pilo-server" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
url = "2"
global-hotkey = "0.8"
base64 = "0.22"
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.3"
sha2 = "0.10"
tower-http = { version = "0.6", features = ["timeout"] }
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
# Without a native backend, keyring falls back to non-persistent per-entry mocks.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = [
	"fs",
	"io-util",
	"macros",
	"process",
	"rt",
	"sync",
	"time",
] }
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-text = "22"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_DirectWrite",
	"Win32_Storage_EnhancedStorage",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Variant",
	"Win32_UI_Shell",
	"Win32_UI_Shell_PropertiesSystem",
] }
