[package]
name = "pilo-server"
version.workspace = true
edition = "2024"

[dependencies]
memchr = "2"
notify = "8.2.0"
pilo-protocol = { path = "../pilo-protocol" }
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
	"io-std",
	"io-util",
	"macros",
	"process",
	"rt-multi-thread",
	"sync",
	"time",
] }
