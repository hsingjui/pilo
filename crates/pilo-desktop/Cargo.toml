[package]
name = "pilo-desktop"
version = "0.5.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
log = "0.4"
mime_guess = "2"
nsh-core = "0.7.0"
pilo-domain = { path = "../pilo-domain" }
pilo-runtime = { path = "../pilo-runtime" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = [
	"fs",
	"io-util",
	"rt-multi-thread",
	"sync",
] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
mac-notification-sys = "0.6.15"
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
	"Win32_Networking_WinHttp",
	"Win32_System_Com",
	"Win32_System_Registry",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
