[package]
name = "pilo-desktop"
version = "0.5.1"
edition = "2024"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", features = ["sink"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
log = "0.4"
mime_guess = "2"
nsh-core = "0.7.2"
pilo-domain = { path = "../pilo-domain" }
pilo-runtime = { path = "../pilo-runtime" }
proxy-watch = { version = "0.3.1", features = ["pac-native"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots", "socks"] }
reqwest-websocket = "0.5.1"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = [
	"fs",
	"io-util",
	"macros",
	"rt-multi-thread",
	"sync",
	"time",
] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "crypto-rust", "tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
mac-notification-sys = "0.6.15"
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
	"Win32_Foundation",
	"Win32_Storage_EnhancedStorage",
	"Win32_Storage_FileSystem",
	"Win32_System_Com",
	"Win32_System_Com_StructuredStorage",
	"Win32_System_Registry",
	"Win32_System_Variant",
	"Win32_UI_Shell",
	"Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61.2", features = [
	"Win32_Networking_WinHttp",
	"Win32_System_Com",
	"Win32_System_Registry",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"
