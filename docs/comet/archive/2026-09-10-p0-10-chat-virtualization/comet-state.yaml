acceptance:
  - id: A1
    source: brief.md
    text: A1：消息数量低于 virtualization 阈值时保持当前直接渲染路径；达到长会话阈值后只挂载视口附近消息，并保留合理 overscan。
    result: passed
    reason:
      text: Current-session review confirms shouldVirtualizeChatMessages enables
        virtualization at 40 messages, short sessions retain the existing direct
        messages.map render path, and TanStack Virtual is configured with
        overscan=6 so only viewport-near rows are mounted.
      truncated: false
  - id: A2
    source: brief.md
    text: A2：virtualized item 使用消息 id 作为稳定 key，并能根据实际 DOM 高度重新测量；包含长
      Markdown、展开/折叠活动块以及 streaming 增长时不会依赖固定行高。
    result: passed
    reason:
      text: Virtual rows use session-scoped message ids as stable keys and call
        messageVirtualizer.measureElement on each mounted row; TanStack Virtual
        observes real element sizes, so Markdown, thinking/tool blocks, reply
        runway, and streaming growth are not constrained to fixed heights.
      truncated: false
  - id: A3
    source: brief.md
    text: A3：长会话初次进入与切换 Session 后仍能定位到最新消息；sticky 状态下 assistant streaming
      持续跟随底部，用户主动上滚后停止强制跟随，滚动到底部按钮可恢复跟随。
    result: passed
    reason:
      text: Current ChatPage session switching is synchronous and the session-id
        effect restores sticky state and scrolls to the latest message;
        streaming updates scroll only while stickyRef remains true, onScroll
        clears stickiness after user up-scroll, and the existing
        scroll-to-bottom button restores it. The future Session Index
        loading->ready path is not wired yet and is recorded as a follow-up risk
        rather than a current regression.
      truncated: false
  - id: A4
    source: brief.md
    text: A4：Conversation Outline 在长会话中点击任意 round 都能跳到对应消息，即使目标消息此前未挂载；当前 round
      高亮不依赖所有消息 DOM ref 常驻。
    result: passed
    reason:
      text: Outline entries now retain their starting messageIndex. Virtualized
        active-round selection maps the reading-line virtual item index to the
        outline via binary search, and jumps use scrollToIndex(messageIndex), so
        the destination need not already be mounted.
      truncated: false
  - id: A5
    source: brief.md
    text: A5：发送新消息时现有 reply runway 逻辑仍生效；composer 与消息列布局、底部自然遮挡和滚动条对齐无回归。
    result: passed
    reason:
      text: Reply-runway calculation and AssistantMessage minHeight are unchanged and
        the last virtual row still receives replyRunwayPx. Virtual padding
        reproduces the existing responsive top/bottom spacing, while scrollbar
        container and composer overlay/occlusion markup remain unchanged outside
        the message-list render branch.
      truncated: false
  - id: A6
    source: brief.md
    text: A6：改动不包含 `src-tauri/**`、Connection、WSL 或 runtime transport 文件，能够与 P0.5
      独立合并。
    result: passed
    reason:
      text: Changed code paths are limited to package metadata, chat frontend
        components, two frontend helpers, unit tests, and Comet artifacts. No
        src-tauri, Connection, WSL transport, or src/lib/pi-runtime files are
        modified. The same frontend patch was previously applied over latest
        main 08dca0f after P0.5 and passed all frontend checks; current
        unrelated Settings dirty files do not overlap.
      truncated: false
  - id: A7
    source: brief.md
    text: A7：`pnpm check`、`pnpm build`、`pnpm test:unit` 通过；新增纯函数测试覆盖 virtualization
      阈值及 outline/message index 映射边界。
    result: passed
    reason:
      text: Fresh current-session execution passed pnpm check with zero
        warnings/errors, pnpm test:unit with 9/9 tests including the 39/40
        threshold and outline/message-index mapping cases, pnpm build, and git
        diff --check.
      truncated: false
