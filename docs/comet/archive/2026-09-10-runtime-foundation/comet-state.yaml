acceptance:
  - id: A1
    source: brief.md
    text: "A1: 存在稳定的 Tauri Command / Event 边界，React 不需要直接访问 process/system API。"
    result: passed
    reason:
      text: Six Tauri commands form a thin runtime boundary and pilo://runtime emits
        typed serde-tagged events; React does not need process/system access.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: `Connection` domain model 覆盖 Local / WSL / SSH，并与 PiSession 生命周期解耦。"
    result: passed
    reason:
      text: Connection/ConnectionKind covers Local, WSL and SSH without transport
        branching inside PiSession.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 存在可复用 process execution abstraction，可配置 program/args/cwd/env 并以 piped
      stdin/stdout/stderr 启动子进程。"
    result: passed
    reason:
      text: ProcessSpec configures program/args/cwd/env and ManagedProcess uses piped
        stdin/stdout/stderr with tokio::process.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: PiSession 支持 spawn / stop / restart / abort；abort 写入 RPC JSONL
      command，stop 才终止进程。"
    result: passed
    reason:
      text: PiSession implements spawn/stop/restart/abort; abort writes a JSONL RPC
        command while stop terminates the child process.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: Pi RPC codec 严格仅按 LF (`\\n`) 切 frame；CRLF 只在 frame 尾部移除可选 `\\r`，没有 LF
      的尾部数据保持 buffered。"
    result: passed
    reason:
      text: JsonlCodec frames only on LF, strips only optional trailing CR, buffers
        unterminated tails, and tests include U+2028, CRLF, chunking and invalid
        JSON.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: stdout 只进入 RPC JSON decoder；stderr 只作为独立 runtime log event，不尝试 JSON
      解码。"
    result: passed
    reason:
      text: stdout exclusively enters the RPC JSONL codec while stderr becomes
        independent runtime_log events without JSON decoding.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 每次 spawn/restart 生成递增 generation id，旧 process reader 晚到的 stale events
      在应用事件层前被忽略。"
    result: passed
    reason:
      text: Generation IDs are monotonic and all reader/codec events are gated before
        the sink so stale process output is suppressed.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Runtime 事件 payload 可序列化，至少覆盖 process state、RPC message、runtime log 和
      runtime error。"
    result: passed
    reason:
      text: RuntimeEvent serializes stable process_state, rpc_message, runtime_log and
        runtime_error variants with generation IDs.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: `cargo fmt --all --check`、`cargo check`、`cargo clippy --all-targets
      --all-features -- -D warnings`、`cargo test` 全部通过。"
    result: passed
    reason:
      text: Comet Runtime receipts show cargo fmt --all --check, cargo check, cargo
        clippy --all-targets --all-features -- -D warnings, and cargo test all
        passed; verifier static review is consistent.
      truncated: false
