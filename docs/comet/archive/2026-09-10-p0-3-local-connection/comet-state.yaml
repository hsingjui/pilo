acceptance:
  - id: A1
    source: brief.md
    text: "A1: Local Connection 有稳定的 typed model，可表示本机连接和探测到的环境信息。"
    result: passed
    reason:
      text: LocalConnection, LocalConnectionProbe, and LocalEnvironmentInfo provide
        stable serde typed models for the local connection and discovered
        environment; serialization/tag tests cover the payload shape.
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: Local 探测能找到 PATH 中的 `pi`；找不到时返回明确的 `pi_not_found` 类错误，而不是通用 spawn 错误。"
    result: passed
    reason:
      text: Local executable discovery searches PATH and Windows PATHEXT candidates,
        returns the detected executable path, and emits the distinct
        PiNotFound/pi_not_found error before spawn when no executable is found.
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 能获取 Pi 版本，并把原始版本输出整理为稳定字段返回。"
    result: passed
    reason:
      text: Pi version detection runs the detected executable with --version under a
        timeout and preserves trimmed version text without relying on a narrow
        version format; a fixture test verifies version discovery.
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 给定存在的 Workspace，Local launcher 以该目录为 cwd 启动 `pi --mode rpc`，且生产参数中不存在
      `--no-extensions`。"
    result: passed
    reason:
      text: Local ProcessSpec uses the detected Pi executable, canonical workspace
        cwd, and exactly --mode rpc; --no-extensions is absent. The real WSL
        smoke emitted extension_ui_request frames, confirming normal extension
        loading.
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: environment info 至少包含规范化 cwd、Git branch（非 Git 仓库时允许为空）和 Pi version。"
    result: passed
    reason:
      text: LocalEnvironmentInfo returns canonical cwd, optional git branch from git
        symbolic-ref, detected Pi executable, and Pi version; non-Git workspaces
        degrade gitBranch to null without blocking the connection.
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: Workspace 不存在/不是目录、Pi 版本探测失败、Pi spawn 失败均具有明确可区分的错误码与消息。"
    result: passed
    reason:
      text: Code inspection confirms distinct stable InvalidWorkspace, PiNotFound,
        PiVersionFailed, and PiSpawnFailed error codes/messages covering invalid
        workspace, missing Pi, version probe failures, and PiSession spawn
        failures.
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: Pi RPC 非零退出会继续通过 runtime error/process state 事件对上层可见，不把 stderr 混入 RPC
      stdout。"
    result: passed
    reason:
      text: A nonzero Pi process exit emits RuntimeError ProcessExit plus ProcessState
        Failed, while stdout remains JSONL RPC-only and stderr remains
        RuntimeLog-only; dedicated regression tests cover crash state and stream
        separation.
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: Local Connection 能复用 P0.2 的 PiSession / ProcessSpec，不把 Local 特有逻辑散落进
      JSONL codec 或 React。"
    result: passed
    reason:
      text: Local behavior is isolated in runtime/local.rs and reuses the P0.2
        PiSession and ProcessSpec seam; the JSONL codec remains
        transport-agnostic and React contains no Local system/process logic.
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: Rust 格式、check、clippy、test 通过；前端若有改动则 pnpm format/check/build 通过。"
    result: passed
    reason:
      text: Comet Runtime independently passed cargo fmt --all --check, cargo check,
        cargo clippy with warnings denied, cargo test (19 tests), pnpm check,
        and pnpm build.
      truncated: false
